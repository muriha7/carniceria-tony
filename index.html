// ============================================================
const MSAL_CLIENT_ID = '169c0050-01d1-47a6-a750-30b4aef52d9e';
const MSAL_TENANT_ID = '5fbce2d1-0aee-4ab3-ba1c-f8f27fe66cea';
// Antes esto era una URL fija (la de GitHub Pages), así que sin importar desde dónde entraras a
// la app (GitHub Pages, Netlify, o cualquier otro lugar), Microsoft SIEMPRE te devolvía a esa
// URL fija después del login — si esa dirección estaba caída (como pasó hoy), el login quedaba
// roto aunque la app funcionara perfecto desde otro lado. Ahora se arma con la dirección actual
// del navegador, así el login siempre vuelve adonde realmente estás usando la app.
// IMPORTANTE: cada dirección desde la que se use la app (GitHub Pages, Netlify, etc.) tiene que
// estar agregada como "Redirect URI" en el App Registration de Azure — si no, Microsoft va a
// rechazar el login con un error de "dirección no autorizada" en vez de este 404.
const MSAL_REDIRECT_URI = window.location.origin + window.location.pathname;

const pca = (() => {
  try {
    if (!window.msal) throw new Error('No cargó la librería de Microsoft (msal). Revisá tu conexión y recargá la página.');
    return new window.msal.PublicClientApplication({
      auth: {
        clientId: MSAL_CLIENT_ID,
        authority: 'https://login.microsoftonline.com/common',
        redirectUri: MSAL_REDIRECT_URI,
      },
      cache: { cacheLocation: 'localStorage' },
    });
  } catch (e) {
    document.getElementById('root').innerHTML =
      `<div style="padding:24px;font-family:sans-serif;color:#7A2331;background:#F3E9DC;min-height:100vh;">
        <h3>No se pudo iniciar la app</h3><p>${e.message}</p>
      </div>`;
    throw e;
  }
})();

const GRAPH_SCOPES = ['Files.ReadWrite', 'User.Read'];

// MSAL necesita asentar su estado interno (leer y validar la caché de localStorage, resolver
// cualquier respuesta de login pendiente) antes de que se pueda confiar en getAllAccounts() o
// pedir un token. Si no se espera esto, justo después de abrir la app getAllAccounts() puede
// devolver una lista vacía aunque haya una cuenta guardada de una sesión anterior — y recién
// se "arregla" en el segundo intento (o después de recargar), porque para entonces MSAL ya
// terminó de inicializarse solo. msalListo es la promesa que marca ese momento.
const msalListo = pca.handleRedirectPromise().catch(() => null).then(() => true);

// Evita pedidos de token duplicados en simultáneo: si varias pantallas piden datos a la vez al
// abrir la app (Dashboard, Resumen, Compras), sin esto cada una dispara su propio
// acquireTokenSilent/Popup por separado. Si el primero falla, pueden terminar abriendo VARIOS
// popups al mismo tiempo — el navegador bloquea todos menos uno, y el resto de las pantallas se
// queda sin datos con un error que no dice claramente qué pasó. Con esto, todos comparten el
// mismo pedido en curso.
let tokenEnCurso = null;

async function ensureLogin() {
  await msalListo;
  let account = pca.getAllAccounts()[0];
  if (!account) {
    const res = await pca.loginPopup({ scopes: GRAPH_SCOPES });
    account = res.account;
  }
  return account;
}

function logoutExcel() {
  const account = pca.getAllAccounts()[0];
  if (account) pca.logoutPopup({ account });
}

async function getGraphToken() {
  if (tokenEnCurso) return tokenEnCurso;
  tokenEnCurso = (async () => {
    const account = await ensureLogin();
    // Justo después de iniciar sesión, el primer pedido silencioso a veces todavía no
    // encuentra el token recién guardado en caché (una demora de un instante, no un error
    // real) — 2 intentos rápidos con una pequeña espera evitan tener que recurrir a un popup
    // por algo que en realidad ya está disponible medio segundo después.
    for (let intento = 0; intento < 2; intento++) {
      try {
        const res = await pca.acquireTokenSilent({ scopes: GRAPH_SCOPES, account });
        return res.accessToken;
      } catch (e) {
        if (intento === 0) await new Promise((r) => setTimeout(r, 400));
      }
    }
    // Último recurso: pedir el token con un popup. Esto solo tiene chance de funcionar si el
    // llamado original vino de un toque directo del usuario (el navegador bloquea popups
    // disparados desde código automático) — por eso los reintentos de arriba existen: para que
    // este camino casi nunca haga falta.
    const res = await pca.acquireTokenPopup({ scopes: GRAPH_SCOPES, account });
    return res.accessToken;
  })();
  try {
    return await tokenEnCurso;
  } finally {
    // se limpia siempre (haya salido bien o mal), así la próxima llamada arranca de cero
    tokenEnCurso = null;
  }
}

async function graphFetch(url, opts = {}) {
  const token = await getGraphToken();
  const res = await fetch(url, {
    ...opts,
    headers: { ...(opts.headers || {}), Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
  });
  if (!res.ok) {
    const t = await res.text().catch(() => '');
    throw new Error(`Graph ${res.status}: ${t.slice(0, 200)}`);
  }
  return res.status === 204 ? null : res.json();
}

// Reintento automático para las cargas de datos que se disparan solas (Dashboard, Resumen,
// Compras) al abrir una pestaña o conectar el Excel: si el primer intento falla por algo
// transitorio (una demora de red, el token terminando de asentarse), se reintenta una vez más
// antes de mostrarle un error al usuario. Así nadie tiene que tocar "Actualizar" a mano ni
// reiniciar la app para algo que se resuelve solo medio segundo después.
async function conReintentoAuto(fn, intentos = 2, esperaMs = 1200) {
  let ultimoError;
  for (let i = 0; i < intentos; i++) {
    try {
      return await fn();
    } catch (e) {
      ultimoError = e;
      if (i < intentos - 1) await new Promise((r) => setTimeout(r, esperaMs));
    }
  }
  throw ultimoError;
}

// ---------- identidad segura del archivo (req. 4) ----------
async function buscarCandidatosExcel(query) {
  if (!query) throw new Error('Escribí parte del nombre del archivo para buscar.');
  const term = query.toLowerCase();
  // En vez de /search (que depende del índice de SharePoint y puede tardar
  // en reflejar archivos nuevos o recién renombrados), listamos los archivos
  // reales de la raíz de OneDrive: esto es siempre instantáneo.
  let url = `https://graph.microsoft.com/v1.0/me/drive/root/children?$top=200&$select=id,name,parentReference`;
  let items = [];
  while (url) {
    const data = await graphFetch(url);
    items = items.concat(data.value || []);
    url = data['@odata.nextLink'] || null;
  }
  return items
    .filter((i) => i.name && i.name.toLowerCase().endsWith('.xlsx') && i.name.toLowerCase().includes(term))
    .map((i) => ({ id: i.id, name: i.name, path: (i.parentReference && i.parentReference.path) || '' }));
}

async function verificarArchivoConectado(excelFile) {
  if (!excelFile || !excelFile.id) throw new Error('No hay ningún archivo Excel seleccionado. Andá a Ajustes y elegilo.');
  try {
    await graphFetch(`https://graph.microsoft.com/v1.0/me/drive/items/${excelFile.id}`);
  } catch (e) {
    throw new Error('ARCHIVO_NO_ENCONTRADO');
  }
}

// req. 8: antes de habilitar la sync, chequear que existan todas las hojas y algunos rangos clave.
// Devuelve la lista de semanas activas del archivo (Sem1-4 siempre, +Sem5 si está completa) para
// que el resto de la app la use en vez de asumir una cantidad fija.
async function verificarEstructuraArchivo(fileId) {
  const data = await graphFetch(`https://graph.microsoft.com/v1.0/me/drive/items/${fileId}/workbook/worksheets`);
  const nombres = new Set((data.value || []).map((w) => w.name));
  const requeridas = [];
  for (const s of SEMANAS_EXCEL_BASE) {
    requeridas.push(`${s} — Pesada`, `${s} — Ventas`, `${s} — Compras`, `${s} — Resumen`);
  }
  requeridas.push('Cuentas por Cobrar');
  const faltantes = requeridas.filter((n) => !nombres.has(n));
  if (faltantes.length > 0) {
    throw new Error('PLANTILLA_INCOMPATIBLE: faltan hojas: ' + faltantes.join(', '));
  }
  const semanasActivas = detectarSemanasDisponibles(nombres);
  // chequeo liviano de un par de rangos clave por semana — en paralelo (antes eran 8 lecturas
  // en fila, una por una; conectar un archivo tardaba varios segundos sin necesidad). Se hace
  // sobre semanasActivas (4 o 5 según lo que tenga el archivo), no sobre una lista fija.
  try {
    await Promise.all(semanasActivas.flatMap((s) => [
      excelReadRange(fileId, `${s} — Pesada`, 'B2:D2'),
      excelReadRange(fileId, `${s} — Compras`, 'A3:A3'),
    ]));
  } catch (e) {
    throw new Error('PLANTILLA_INCOMPATIBLE: no pude leer los rangos esperados de una de las semanas.');
  }
  return semanasActivas;
}

// req. 5: detecta automáticamente a qué SemN pertenece una fecha, leyendo las hojas Pesada de las
// semanas activas del archivo conectado (4 o 5, según corresponda — nunca una cantidad fija).
// Se leen todas en paralelo (antes era una por una, esperando a que cada una termine para recién
// empezar la siguiente) — esto se llama cada vez que se cambia de fecha en Ventas, así que la
// diferencia se siente directamente en la app.
async function detectarSemana(fileId, dateStr, semanasActivas) {
  const semanas = semanasActivas && semanasActivas.length ? semanasActivas : SEMANAS_EXCEL_BASE;
  const fecha = parseISO(dateStr);
  const fUTC = Date.UTC(fecha.getFullYear(), fecha.getMonth(), fecha.getDate());
  const resultados = await Promise.all(semanas.map(async (s) => {
    try {
      const r = await excelReadRange(fileId, `${s} — Pesada`, 'B2:D2');
      const vals = r.values && r.values[0];
      if (!vals || vals[0] === '' || vals[2] === '') return null;
      const desde = typeof vals[0] === 'number' ? fromExcelSerial(vals[0]) : new Date(vals[0]);
      const hasta = typeof vals[2] === 'number' ? fromExcelSerial(vals[2]) : new Date(vals[2]);
      const dUTC = Date.UTC(desde.getUTCFullYear(), desde.getUTCMonth(), desde.getUTCDate());
      const hUTC = Date.UTC(hasta.getUTCFullYear(), hasta.getUTCMonth(), hasta.getUTCDate());
      if (fUTC >= dUTC && fUTC <= hUTC) return { sem: s, desde, hasta };
      return null;
    } catch (e) {
      return null; // seguir probando las otras semanas
    }
  }));
  return resultados.find((r) => r) || null;
}

function wsRangeUrl(fileId, sheet, address) {
  return `https://graph.microsoft.com/v1.0/me/drive/items/${fileId}/workbook/worksheets('${encodeURIComponent(sheet)}')/range(address='${address}')`;
}
function excelWriteRange(fileId, sheet, address, values) {
  return graphFetch(wsRangeUrl(fileId, sheet, address), { method: 'PATCH', body: JSON.stringify({ values }) });
}
function excelReadRange(fileId, sheet, address) {
  return graphFetch(wsRangeUrl(fileId, sheet, address));

}
// escribe y vuelve a leer para confirmar que el Excel realmente quedó con esos valores (req. 12)
async function excelWriteVerificado(fileId, sheet, address, values) {
  await excelWriteRange(fileId, sheet, address, values);
  const want = values.map((row) => row.map((v) => (typeof v === 'string' ? v : num(v))));
  // La API de Excel a veces tarda un instante en reflejar, en una lectura inmediata siguiente,
  // algo que se acaba de escribir un segundo antes (el backend de Excel Online no siempre
  // "despierta" al toque) — sin esto, la verificación podía fallar en falso justo después de un
  // guardado que en realidad SÍ se había hecho bien, mandando la operación a la cola de
  // pendientes sin necesidad (esto es lo que se veía como "el primer intento siempre falla").
  // Se espera un instante antes del primer chequeo (para no depender de un reintento en el caso
  // normal) y, si igual no coincide, se reintenta la LECTURA un par de veces más con más espera.
  // Importante: acá se reintenta solo la LECTURA de verificación, nunca la escritura — la
  // escritura ya se hizo una sola vez arriba, así que esto no puede duplicar nada.
  for (let intento = 0; intento < 4; intento++) {
    await new Promise((r) => setTimeout(r, 250 * (intento + 1)));
    const chk = await excelReadRange(fileId, sheet, address);
    const got = (chk.values || []).map((row) => row.map((v) => (typeof v === 'string' ? v : num(v))));
    if (JSON.stringify(got) === JSON.stringify(want)) return; // confirmado
  }
  throw new Error(`Excel no confirmó el valor escrito en ${sheet}!${address}. Reintentá.`);
}

function colLetter(n) {
  let s = '';
  while (n > 0) {
    const m = (n - 1) % 26;
    s = String.fromCharCode(65 + m) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}
const BLOCK_COLS = [1, 6, 11, 16, 21, 26, 31]; // Lun, Mar, Mié, Jue, Vie, Sáb, Dom
const DIAS_NOMBRE = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
function weekdayIdx(dateStr) {
  const d = parseISO(dateStr).getDay();
  return d === 0 ? 6 : d - 1;
}
function toExcelSerial(dateStr) {
  const d = parseISO(dateStr);
  const epoch = Date.UTC(1899, 11, 30);
  const utc = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.round((utc - epoch) / 86400000);
}
function fromExcelSerial(serial) {
  const epoch = Date.UTC(1899, 11, 30);
  return new Date(epoch + serial * 86400000);
}

// ---------- validación de semana/fecha contra la hoja Pesada (req. 5) ----------
async function validarFechaEnSemana(fileId, semSheet, dateStr) {
  const ws = `${semSheet} — Pesada`;
  const r = await excelReadRange(fileId, ws, 'B2:D2');
  const vals = r.values && r.values[0];
  if (!vals || vals[0] === '' || vals[2] === '') {
    throw new Error(`No pude leer las fechas de "${ws}" (celdas B2 y D2). Completalas en Excel antes de sincronizar.`);
  }
  const desde = typeof vals[0] === 'number' ? fromExcelSerial(vals[0]) : new Date(vals[0]);
  const hasta = typeof vals[2] === 'number' ? fromExcelSerial(vals[2]) : new Date(vals[2]);
  const fecha = parseISO(dateStr);
  const fUTC = Date.UTC(fecha.getFullYear(), fecha.getMonth(), fecha.getDate());
  const dUTC = Date.UTC(desde.getUTCFullYear(), desde.getUTCMonth(), desde.getUTCDate());
  const hUTC = Date.UTC(hasta.getUTCFullYear(), hasta.getUTCMonth(), hasta.getUTCDate());
  if (fUTC < dUTC || fUTC > hUTC) {
    throw new Error('La fecha seleccionada no pertenece a la semana de Excel elegida.');
  }
}

// ---------- lectura de un día completo de Ventas (para mezclar antes de escribir) ----------
async function leerVentaDia(fileId, semSheet, dateStr) {
  const day = weekdayIdx(dateStr);
  const block = BLOCK_COLS[day];
  const c1 = colLetter(block + 1), c2 = colLetter(block + 2), c3 = colLetter(block + 3), c0 = colLetter(block);
  const ws = `${semSheet} — Ventas`;
  const mostrador = await excelReadRange(fileId, ws, `${c1}9:${c2}10`);
  const mv = mostrador.values || [['', ''], ['', '']];
  const out = {
    manana: { mostradorEf: mv[0][0] || '', mostradorTj: mv[0][1] || '' },
    tarde: { mostradorEf: mv[1][0] || '', mostradorTj: mv[1][1] || '' },
    deliveries: [],
    clientes: [],
  };
  if (day <= 4) {
    const d = await excelReadRange(fileId, ws, `${c1}15:${c2}19`);
    out.deliveries = (d.values || []).map((row) => ({ ef: row[0] || '', tr: row[1] || '' }));
  }
  if (day <= 5) {
    const cl = await excelReadRange(fileId, ws, `${c0}24:${c3}31`);
    out.clientes = (cl.values || []).map((row) => ({ nombre: row[0] || '', ef: row[1] || '', tr: row[2] || '', cobrado: row[3] === 'SI' || row[3] === 'SÍ' }));
  }
  return out;
}

// ---------- escritura segura de una venta (req. 1, 2, 6, 12) ----------
// Solo toca: la fila del turno que se está guardando, y delivery/clientes SOLO si fueron editados explícitamente (dirty).
async function excelSyncVentaDia(fileId, semSheet, dateStr, turno, turnoForm, deliveries, deliveriesDirty, clientes, clientesDirty) {
  const day = weekdayIdx(dateStr);
  if (day === 6 && turno === 'tarde') {
    throw new Error('El domingo el local no trabaja por la tarde: no se escribe ese turno.');
  }
  await validarFechaEnSemana(fileId, semSheet, dateStr);
  const block = BLOCK_COLS[day];
  const c1 = colLetter(block + 1), c2 = colLetter(block + 2), c3 = colLetter(block + 3), c0 = colLetter(block);
  const ws = `${semSheet} — Ventas`;
  const fila = turno === 'manana' ? 9 : 10;
  const antes = { mostrador: null, deliveries: null, clientes: null };

  // Se leen primero TODOS los rangos que hagan falta (mostrador siempre; delivery/clientes si
  // corresponde), en paralelo, y recién con eso ya en mano se escribe. Antes cada bloque se leía
  // y escribía uno atrás del otro (leer mostrador, escribir mostrador, leer delivery, escribir
  // delivery, leer clientes, escribir clientes) — esa cadena secuencial dejaba huecos entre
  // escrituras donde un corte de conexión podía guardar, por ejemplo, el mostrador y el delivery
  // pero no los clientes especiales, sin ningún aviso claro de cuál quedó a medio camino.
  const rangoMostrador = `${c1}${fila}:${c2}${fila}`;
  const rangoDelivery = `${c1}15:${c2}19`;
  const rangoClientes = `${c0}24:${c3}31`;
  const [actualMostrador, actualDelivery, actualClientes] = await Promise.all([
    excelReadRange(fileId, ws, rangoMostrador),
    deliveriesDirty && day <= 4 ? excelReadRange(fileId, ws, rangoDelivery) : Promise.resolve(null),
    clientesDirty && day <= 5 ? excelReadRange(fileId, ws, rangoClientes) : Promise.resolve(null),
  ]);

  const av = (actualMostrador.values && actualMostrador.values[0]) || ['', ''];
  antes.mostrador = { fila: rangoMostrador, valores: av };
  const nuevoEf = turnoForm.mostradorEf === '' ? av[0] : num(turnoForm.mostradorEf);
  const nuevoTj = turnoForm.mostradorTj === '' ? av[1] : num(turnoForm.mostradorTj);

  const escrituras = [excelWriteVerificado(fileId, ws, rangoMostrador, [[nuevoEf, nuevoTj]])];

  if (actualDelivery) {
    antes.deliveries = { rango: rangoDelivery, valores: actualDelivery.values || [] };
    const filasDelivery = [];
    for (let i = 0; i < 5; i++) {
      const it = deliveries[i] || {};
      filasDelivery.push([num(it.ef), num(it.tr)]);
    }
    escrituras.push(excelWriteVerificado(fileId, ws, rangoDelivery, filasDelivery));
  }
  if (actualClientes) {
    antes.clientes = { rango: rangoClientes, valores: actualClientes.values || [] };
    const filasClientes = [];
    for (let i = 0; i < 8; i++) {
      const it = clientes[i] || {};
      filasClientes.push([it.nombre || '', num(it.ef), num(it.tr), it.cobrado ? 'SI' : '']);
    }
    escrituras.push(excelWriteVerificado(fileId, ws, rangoClientes, filasClientes));
  }
  // Las 3 escrituras (mostrador, delivery, clientes) van todas juntas: son rangos que no se
  // superponen entre sí, así que no hay riesgo de que se pisen — y al mandarlas en paralelo,
  // desaparece el hueco de tiempo entre una y otra donde antes podía cortarse la conexión.
  await Promise.all(escrituras);
  return { antes, ws };
}

// req. 3 (deshacer): reescribe los rangos exactos con los valores que había antes, verificando cada uno
async function excelDeshacerVenta(fileId, ws, antes) {
  const escrituras = [];
  if (antes.mostrador) escrituras.push(excelWriteVerificado(fileId, ws, antes.mostrador.fila, [antes.mostrador.valores]));
  if (antes.deliveries) escrituras.push(excelWriteVerificado(fileId, ws, antes.deliveries.rango, antes.deliveries.valores));
  if (antes.clientes) escrituras.push(excelWriteVerificado(fileId, ws, antes.clientes.rango, antes.clientes.valores));
  await Promise.all(escrituras);
}

// req. 3 (deshacer compra): la fila no existía antes, así que deshacer = vaciarla (solo si nadie la tocó después)
async function excelDeshacerCompra(fileId, semSheet, row, fechaSerialEsperada) {
  const ws = `${semSheet} — Compras`;
  const actual = await excelReadRange(fileId, ws, `B${row}:B${row}`);
  const actualFecha = actual.values && actual.values[0] && actual.values[0][0];
  if (actualFecha !== fechaSerialEsperada) {
    throw new Error('Esa fila ya fue modificada después de cargarla — no se puede deshacer automáticamente. Corregila a mano en el Excel.');
  }
  await Promise.all([
    excelWriteVerificado(fileId, ws, `B${row}:H${row}`, [['', '', '', '', '', '', '']]),
    excelWriteVerificado(fileId, ws, `J${row}:J${row}`, [['']]),
  ]);
}

// ---------- compras: kg/unidad o importe directo, con Observaciones (req. 8) ----------
// req. 1 y 2: rango correcto (nunca la fila 43, que es TOTAL COMPRAS), e idempotente por operationId.
// Si la operación ya tenía una fila asignada (viene de un reintento), se reusa esa misma fila.
async function excelSyncCompra(fileId, semSheet, compra, filaAsignada, onRowAssigned) {
  await validarFechaEnSemana(fileId, semSheet, compra.fecha);
  const ws = `${semSheet} — Compras`;
  let row = filaAsignada;
  if (!row) {
    // Lee fecha (B) Y el resto de los datos (D:J): una fila solo se considera libre si TODO está
    // vacío. Si solo mirásemos la fecha, una fila que haya quedado con datos parciales de una
    // operación anterior interrumpida (con fecha sin escribir todavía) se vería "libre" y una
    // compra nueva la pisaría a medias — mezclando dos compras distintas en la misma fila.
    const rango = await excelReadRange(fileId, ws, 'B3:J42');
    const vals = rango.values || [];
    for (let i = 0; i < vals.length; i++) {
      const fila = vals[i] || [];
      const vacia = fila.every((v) => v === '' || v == null);
      if (vacia) { row = 3 + i; break; }
    }
    if (!row) throw new Error('No hay filas disponibles en Compras de esta semana. La capacidad máxima es de 40 compras. Si creés que hay filas con datos parciales o corruptos ocupando lugar, revisalas directamente en el Excel.');
  }
  if (onRowAssigned) onRowAssigned(row);
  // Fecha + datos (B:H) y Observaciones (J) se escriben EN PARALELO, no una atrás de la otra.
  // Antes iban en secuencia: primero se escribía y confirmaba B:H (lo cual, con los reintentos
  // de excelWriteVerificado, puede tardar más de un segundo), y recién Después arrancaba la
  // escritura de J. Ese hueco entre una y otra era exactamente la ventana en la que un corte de
  // conexión podía dejar la compra con todos sus datos y el total bien calculado, pero sin la
  // observación — que es lo que se vio en la compra de Cumpa. Como son rangos que no se pisan
  // entre sí (B:H por un lado, J por otro — I nunca se toca, tiene la fórmula del Total), no hay
  // ningún problema en mandarlas juntas.
  const escrituras = [];
  if (compra.modo === 'importe') {
    escrituras.push(excelWriteVerificado(fileId, ws, `B${row}:H${row}`, [[
      toExcelSerial(compra.fecha), DIAS_NOMBRE[weekdayIdx(compra.fecha)],
      compra.proveedor, compra.descripcion || '', compra.tipo, parseImporte(compra.importe), '',
    ]]));
  } else {
    escrituras.push(excelWriteVerificado(fileId, ws, `B${row}:H${row}`, [[
      toExcelSerial(compra.fecha), DIAS_NOMBRE[weekdayIdx(compra.fecha)],
      compra.proveedor, compra.descripcion || '', compra.tipo, parseCantidad(compra.kg), parseImporte(compra.precioKg),
    ]]));
  }
  escrituras.push(excelWriteVerificado(fileId, ws, `J${row}:J${row}`, [[compra.observaciones || '']]));
  await Promise.all(escrituras);
  return row;
}

// gastos operativos (Gasoil / Otros gastos variables): a diferencia de Compras, en la hoja Resumen
// no hay una fila por carga sino UNA celda con el total de la semana (C79 Gasoil, C76 Otros gastos
// variables), así que "cargar un gasto" significa sumarlo al valor que ya esté ahí.
// Sumar-y-escribir no es idempotente por sí solo: si reintentamos a ciegas después de una falla de
// red, podríamos sumar el mismo monto dos veces (el mismo problema que tuvimos con las compras
// duplicadas, pero acá sin siquiera el resguardo de una fila nueva). Por eso, si ya sabemos qué
// valor había ANTES del intento original (baseConocido), en el reintento comparamos:
//  - si la celda sigue en baseConocido -> el intento anterior no llegó a escribir, sumamos ahora.
//  - si la celda ya quedó en baseConocido+monto -> el intento anterior SÍ escribió (solo falló la
//    confirmación), no volvemos a sumar.
//  - si la celda tiene cualquier otro valor -> alguien la tocó a mano en el medio, frenamos y
//    avisamos en vez de pisarla.
function celdaGasto(tipo) { return tipo === 'gasoil' ? 'C79' : 'C76'; }
async function excelSyncGasto(fileId, semSheet, tipo, monto, baseConocido, onBaseRead) {
  const ws = `${semSheet} — Resumen`;
  const cell = celdaGasto(tipo);
  const actual = await excelReadRange(fileId, ws, cell);
  const valorActual = redondear(num(actual.values && actual.values[0] && actual.values[0][0]));
  if (onBaseRead) onBaseRead(valorActual);
  if (baseConocido != null) {
    if (valorActual === redondear(baseConocido + monto)) return valorActual; // ya se había aplicado
    if (valorActual !== redondear(baseConocido)) {
      throw new Error(`La celda ${cell} de "${ws}" cambió (ahora ${fmt(valorActual)}) desde el intento anterior. Revisala en el Excel antes de reintentar este gasto.`);
    }
  }
  const nuevo = redondear(valorActual + monto);
  await excelWriteVerificado(fileId, ws, cell, [[nuevo]]);
  return nuevo;
}

// req. 6: reconstruye la lista real de compras de la semana leyendo directo del Excel (B:J, filas 3-42)
// También detecta filas "huérfanas": tienen algún dato cargado (proveedor, tipo, etc.) pero sin
// fecha en B — señal de una escritura que quedó a medias (ver excelSyncCompra). Se devuelven aparte
// en out.huerfanas para poder avisarle al usuario en vez de esconderlas en silencio.
async function excelLeerComprasSemana(fileId, semSheet) {
  const ws = `${semSheet} — Compras`;
  const r = await excelReadRange(fileId, ws, 'B3:J42');
  const filas = r.values || [];
  const out = [];
  const huerfanas = [];
  filas.forEach((f, i) => {
    const fechaSerial = f[0];
    const row = 3 + i;
    if (!fechaSerial) {
      const tieneAlgo = (f || []).some((v, idx) => idx > 0 && v !== '' && v != null);
      if (tieneAlgo) huerfanas.push({ row, proveedor: f[2] || '', descripcion: f[3] || '', observaciones: f[8] || '' });
      return; // fila vacía (o huérfana, ya registrada arriba)
    }
    const fechaJS = typeof fechaSerial === 'number' ? fromExcelSerial(fechaSerial) : new Date(fechaSerial);
    const fecha = `${fechaJS.getUTCFullYear()}-${String(fechaJS.getUTCMonth() + 1).padStart(2, '0')}-${String(fechaJS.getUTCDate()).padStart(2, '0')}`;
    out.push({
      id: `excel-${semSheet}-${row}`,
      row,
      fecha,
      proveedor: f[2] || '', // D
      descripcion: f[3] || '', // E
      tipo: f[4] || '', // F
      kg: num(f[5]), // G
      precioKg: num(f[6]), // H
      total: num(f[7]), // I (fórmula)
      observaciones: f[8] || '', // J
      fuente: 'excel',
    });
  });
  out.huerfanas = huerfanas;
  return out;
}

// ---------- resumen restringido, solo lectura (req. 10) ----------
async function excelLeerResumen(fileId, semSheet) {
  const ws = `${semSheet} — Resumen`;
  const [ventas, rinde, variables] = await Promise.all([
    excelReadRange(fileId, ws, 'B13:G20'),
    excelReadRange(fileId, ws, 'B84:B92'),
    excelReadRange(fileId, ws, 'C76:C79'),
  ]);
  const v = ventas.values || [];
  const rowEf = v[1] || [];
  const rowDig = v[2] || [];
  const rowCompras = v[7] || [];
  // B84 Sueldos, B85 Bolsas, B86 Variables: son 3 celdas oficiales ya calculadas por Excel (no reconstruimos filas sueltas)
  const rw = rinde.values || [];
  const gastosOperativos = num(rw[0] && rw[0][0]) + num(rw[1] && rw[1][0]) + num(rw[2] && rw[2][0]);
  const rindeNetoOficial = num(rw[8] && rw[8][0]); // B92
  const existenciaFinalRaw = rowCompras[3];
  const existenciaFinalPendiente = existenciaFinalRaw === '' || existenciaFinalRaw === null || existenciaFinalRaw === undefined;
  const vv = variables.values || []; // C76 Otros gastos variables, C79 Gasoil (misma hoja Resumen)
  return {
    ventasEfectivo: num(rowEf[0]),
    ventasDigital: num(rowDig[0]),
    totalCompras: num(rowCompras[0]),
    existenciaInicial: num(rowCompras[2]),
    existenciaFinal: num(rowCompras[3]),
    existenciaFinalPendiente,
    cogs: num(rowCompras[4]),
    gastosOperativos,
    otrosGastosVariables: num(vv[0] && vv[0][0]),
    gasoil: num(vv[3] && vv[3][0]),
    rindeNetoOficial,
  };
}
async function excelLeerVentasTotales(fileId, semSheet) {
  const ws = `${semSheet} — Resumen`;
  const r = await excelReadRange(fileId, ws, 'B16:B16');
  return num(r.values && r.values[0] && r.values[0][0]);
}
// Lee "Cuentas por Cobrar" (todas las semanas) y arma tanto el total pendiente como el detalle
// por cliente. La columna que de verdad indica si un cliente ya fue cobrado es F (SEMANA DE
// COBRO): el usuario la completa a mano cuando cobra, y recién ahí deja de contar como
// pendiente. La columna E (¿COBRADO?) es solo una etiqueta informativa que viene del check de
// "cobrado" de esa semana en Ventas — no se actualiza cuando se completa la Semana de Cobro acá,
// así que no sirve para decidir si el cliente sigue pendiente o no.
async function excelLeerClientesPendientes(fileId) {
  const r = await excelReadRange(fileId, 'Cuentas por Cobrar', 'A4:G200');
  let total = 0;
  const lista = [];
  for (const row of (r.values || [])) {
    const cliente = row[0];
    const semanaVenta = row[1];
    const monto = num(row[2]);
    const semanaCobro = row[5]; // F: SEMANA DE COBRO
    const yaCobrado = semanaCobro !== '' && semanaCobro != null;
    if (cliente && monto > 0 && !yaCobrado) {
      total += monto;
      lista.push({ cliente, semana: semanaVenta || '', monto });
    }
  }
  return { total, lista };
}

// ---------- constants ----------
const PROVEEDORES = ['Pablo', 'Sipe', 'Mario', 'Brolo', 'Toto', 'Luis', 'Paragua', 'AJ', 'Carbón', 'Dani', 'Cumpa', 'Seve', 'Pili', 'Salomón', 'Otro'];
const TIPOS = ['Carne', 'Filet', 'Cajón de pollo', 'Condimentos', 'Carbón', 'Embutidos', 'Achuras', 'Cerdo', 'Exhibidos', 'Otro'];
const DIAS_CORTOS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
const EMPTY_TURNO = { mostradorEf: '', mostradorTj: '' };
const EMPTY_DELIVERY = { ef: '', tr: '' };
const EMPTY_CLIENTE = { nombre: '', ef: '', tr: '', cobrado: false };
// Semanas obligatorias: todo archivo mensual conectado las tiene sí o sí (si falta alguna, el
// archivo se rechaza en verificarEstructuraArchivo, igual que antes).
const SEMANAS_EXCEL_BASE = ['Sem1', 'Sem2', 'Sem3', 'Sem4'];
// Quinta semana: algunos meses caen en 5 semanas calendario y el archivo puede traer una Sem5
// además de las 4 de siempre — pero nunca es obligatoria. Se agrega sola a la lista de semanas
// activas del archivo conectado únicamente si están sus 4 hojas completas.
const SEMANA_OPCIONAL = 'Sem5';

// req.: a partir de los nombres de hoja reales del archivo conectado (los que devuelve Graph),
// arma la lista de semanas con las que va a trabajar la app. Sem1-4 siempre están (se asume que
// el archivo ya pasó la verificación de estructura antes de llamar a esto). Sem5 se suma sola
// solo si tiene sus 4 hojas — nunca hace falta y nunca se exige.
function detectarSemanasDisponibles(nombresHojas) {
  const activas = [...SEMANAS_EXCEL_BASE];
  const hojasSem5 = [
    `${SEMANA_OPCIONAL} — Pesada`, `${SEMANA_OPCIONAL} — Ventas`,
    `${SEMANA_OPCIONAL} — Compras`, `${SEMANA_OPCIONAL} — Resumen`,
  ];
  if (hojasSem5.every((h) => nombresHojas.has(h))) activas.push(SEMANA_OPCIONAL);
  return activas;
}

// ---------- local storage helpers (standalone, no Claude account needed) ----------
const storage = {
  get(key) {
    try {
      const v = localStorage.getItem(key);
      return v ? JSON.parse(v) : null;
    } catch (e) { return null; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch (e) { console.error('storage error', e); return false; }
  },
};

// ---------- date helpers ----------
const pad = (n) => String(n).padStart(2, '0');
const toISO = (dt) => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
const parseISO = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayISO = () => toISO(new Date());
const getWeekStart = (dateStr) => {
  const dt = parseISO(dateStr);
  const day = dt.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  dt.setDate(dt.getDate() + diff);
  return toISO(dt);
};
const addDays = (dateStr, n) => { const dt = parseISO(dateStr); dt.setDate(dt.getDate() + n); return toISO(dt); };
const getWeekDates = (weekStart) => Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
const fmtDate = (dateStr) => { const [y, m, d] = dateStr.split('-'); return `${d}/${m}`; };
// Argentina usa coma decimal. parseCantidad: solo coma->punto (kg/unidades, sin miles).
// parseImporte: además saca puntos de miles antes de convertir la coma (ej: "25.000,50" -> 25000.50).
const parseCantidad = (v) => {
  if (v === '' || v === null || v === undefined) return 0;
  const s = String(v).trim().replace(',', '.');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
};
const parseImporte = (v) => {
  if (v === '' || v === null || v === undefined) return 0;
  let s = String(v).trim().replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
};
const num = parseImporte; // la mayoría de los campos de la app son montos en $
const redondear = (x) => Math.round(x * 100) / 100; // evita falsos "cambió la celda" por errores de punto flotante
const fmt = (n) => {
  if (n === null || n === undefined || isNaN(n)) n = 0;
  const neg = n < 0;
  const abs = Math.round(Math.abs(n));
  const s = abs.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (neg ? '-$' : '$') + s;
};

const mostradorTotal = (t) => !t ? 0 : num(t.mostradorEf) + num(t.mostradorTj);
const deliveriesTotal = (arr) => (arr || []).reduce((a, d) => a + num(d.ef) + num(d.tr), 0);
const clientesCobradoTotal = (arr) => (arr || []).filter((c) => c.cobrado).reduce((a, c) => a + num(c.ef) + num(c.tr), 0);
const clientesPendienteTotal = (arr) => (arr || []).filter((c) => !c.cobrado).reduce((a, c) => a + num(c.ef) + num(c.tr), 0);

const dayEfectivo = (dayObj) => {
  if (!dayObj) return 0;
  const m = dayObj.manana || {}, t = dayObj.tarde || {};
  const delivEf = (dayObj.deliveries || []).reduce((a, d) => a + num(d.ef), 0);
  const cliEf = (dayObj.clientes || []).filter((c) => c.cobrado).reduce((a, c) => a + num(c.ef), 0);
  return num(m.mostradorEf) + num(t.mostradorEf) + delivEf + cliEf;
};
const dayNoEfectivo = (dayObj) => {
  if (!dayObj) return 0;
  const m = dayObj.manana || {}, t = dayObj.tarde || {};
  const delivTr = (dayObj.deliveries || []).reduce((a, d) => a + num(d.tr), 0);
  const cliTr = (dayObj.clientes || []).filter((c) => c.cobrado).reduce((a, c) => a + num(c.tr), 0);
  return num(m.mostradorTj) + num(t.mostradorTj) + delivTr + cliTr;
};
const dayTotal = (dayObj) => dayEfectivo(dayObj) + dayNoEfectivo(dayObj);

function CarniceriaApp() {
  const [tab, setTab] = useState('resumen');

  const [vSaving, setVSaving] = useState(false);

  const [cForm, setCForm] = useState({ fecha: todayISO(), modo: 'kg', proveedor: PROVEEDORES[0], proveedorOtro: '', tipo: TIPOS[0], tipoOtro: '', descripcion: '', kg: '', precioKg: '', importe: '', observaciones: '' });
  const [cSaving, setCSaving] = useState(false);

  const [gForm, setGForm] = useState({ tipo: 'gasoil', monto: '' });
  const [gSaving, setGSaving] = useState(false);
  const [gastosLocal, setGastosLocal] = useState({}); // { [selectedWeek]: [{id, tipo, monto, fecha}] } — historial local, Excel solo guarda el total

  const [excelFile, setExcelFile] = useState(null); // {id, name, path}
  const [semExcelMap, setSemExcelMap] = useState({});
  // req.: semanas activas del archivo conectado (Sem1-4 siempre, +Sem5 si el archivo la tiene
  // completa). Se calcula una vez al conectar/verificar el archivo (verificarEstructuraArchivo)
  // y de ahí en más TODA la app la usa en vez de una lista fija — así un archivo de 4 semanas
  // sigue funcionando exactamente igual que siempre, y uno de 5 incluye la quinta en todo.
  const [semanasActivas, setSemanasActivas] = useState(SEMANAS_EXCEL_BASE);
  const [cuentaConectada, setCuentaConectada] = useState(null);
  const [isOnline, setIsOnline] = useState(navigator.onLine);
  useEffect(() => {
    const onUp = () => setIsOnline(true);
    const onDown = () => setIsOnline(false);
    window.addEventListener('online', onUp);
    window.addEventListener('offline', onDown);
    return () => { window.removeEventListener('online', onUp); window.removeEventListener('offline', onDown); };
  }, []);
  const [syncMsg, setSyncMsg] = useState(null); // {type:'ok'|'error'|'loading', text}
  const [pendientes, setPendientes] = useState([]); // operaciones que fallaron y esperan reintento
  const [registro, setRegistro] = useState([]); // req. 9: registro de actividad local

  const [darkMode, setDarkMode] = useState(() => storage.get('carniceria_dark_mode') === true);
  useEffect(() => {
    document.body.classList.toggle('dark-mode', darkMode);
    storage.set('carniceria_dark_mode', darkMode);
  }, [darkMode]);

  // Cierre semanal: ítems manuales por semana (los que se pueden verificar solos no se guardan acá)
  const [cierreManual, setCierreManual] = useState(() => storage.get('carniceria_cierre_manual') || {});
  const toggleCierreItem = (item) => {
    setCierreManual((prev) => {
      const semanaActual = prev[selectedWeek] || {};
      const next = { ...prev, [selectedWeek]: { ...semanaActual, [item]: !semanaActual[item] } };
      storage.set('carniceria_cierre_manual', next);
      return next;
    });
  };

  useEffect(() => {
    let cancelado = false;
    const v = storage.get('carniceria_ventas');
    const c = storage.get('carniceria_compras');
    const p = storage.get('carniceria_pesada');
    const g = storage.get('carniceria_gastos_local');
    const ef = storage.get('carniceria_excel_file');
    const sm = storage.get('carniceria_sem_excel_map');
    const sa = storage.get('carniceria_semanas_activas');
    const pend = storage.get('carniceria_pendientes');
    const reg = storage.get('carniceria_registro');
    if (reg) setRegistro(reg);
    if (v) setVentas(v);
    if (c) setCompras(c);
    if (p) setPesada(p);
    if (g) setGastosLocal(g);
    if (ef) setExcelFile(ef);
    if (sm) setSemExcelMap(sm);
    // req.: si el archivo guardado tenía Sem5 detectada la última vez, se respeta al reabrir la

    if (sa && Array.isArray(sa) && sa.length) setSemanasActivas(sa);
    if (pend) setPendientes(pend);
    // Se espera a que MSAL termine de inicializarse (ver comentario junto a msalListo, arriba del
    // todo del archivo) antes de confiar en getAllAccounts(). Esto es lo que elimina el "primer
    // intento falla, después de reiniciar la app funciona": antes se leía la cuenta antes de que
    // MSAL estuviera realmente listo para responder eso de forma confiable.
    msalListo.then(() => {
      if (cancelado) return;
      const acc = pca.getAllAccounts()[0];
      if (acc) setCuentaConectada(acc.username);
      setLoaded(true);
    });
    return () => { cancelado = true; };
  }, []);

  useEffect(() => { if (loaded) storage.set('carniceria_ventas', ventas); }, [ventas, loaded]);
  useEffect(() => { if (loaded) storage.set('carniceria_compras', compras); }, [compras, loaded]);
  useEffect(() => { if (loaded) storage.set('carniceria_pesada', pesada); }, [pesada, loaded]);
  useEffect(() => { if (loaded) storage.set('carniceria_gastos_local', gastosLocal); }, [gastosLocal, loaded]);
  useEffect(() => { if (loaded) storage.set('carniceria_excel_file', excelFile); }, [excelFile, loaded]);
  useEffect(() => { if (loaded) storage.set('carniceria_sem_excel_map', semExcelMap); }, [semExcelMap, loaded]);
  useEffect(() => { if (loaded) storage.set('carniceria_semanas_activas', semanasActivas); }, [semanasActivas, loaded]);
  useEffect(() => { if (loaded) storage.set('carniceria_pendientes', pendientes); }, [pendientes, loaded]);
  useEffect(() => { if (loaded) storage.set('carniceria_registro', registro); }, [registro, loaded]);

  const semExcelActual = semExcelMap[selectedWeek] || 'Sem1';
  const setSemExcelActual = (val) => setSemExcelMap((prev) => ({ ...prev, [selectedWeek]: val }));

  // domingo: forzar mañana siempre (req. 6)
  useEffect(() => {
    if (weekdayIdx(vDate) === 6 && vTurno !== 'manana') setVTurno('manana');
  }, [vDate]);

  // al cambiar de día/turno: leer el estado real desde Excel (Excel es la fuente oficial, req. 2)
  useEffect(() => {
    let cancelado = false;
    async function cargar() {
      setVDeliveriesDirty(false);
      setVClientesDirty(false);
      if (!isOnline || !cuentaConectada || !excelFile) {
        // sin conexión o sin Excel: mostramos lo último que se sabe local, con advertencia
        const local = ventas[vDate];
        setVForm(local?.[vTurno] ? { ...local[vTurno] } : EMPTY_TURNO);
        setVDeliveries(local?.deliveries ? [...local.deliveries] : []);
        setVClientes(local?.clientes ? [...local.clientes] : []);
        setVLoadState('offline');
        return;
      }
      setVLoadState('reading');
      try {
        const dia = await conReintentoAuto(async () => {
          await verificarArchivoConectado(excelFile);
          return leerVentaDia(excelFile.id, semExcelActual, vDate);
        });
        if (cancelado) return;
        setVForm({ ...dia[vTurno] });
        setVDeliveries(dia.deliveries);
        setVClientes(dia.clientes);
        setVentas((prev) => ({ ...prev, [vDate]: dia }));
        setVLoadState('ready');
      } catch (e) {
        if (cancelado) return;
        if (e.message === 'ARCHIVO_NO_ENCONTRADO') {
          setExcelFile(null);
          setSyncMsg({ type: 'error', text: 'El archivo Excel conectado ya no existe o cambió de nombre. Volvé a seleccionarlo en Ajustes.' });
        }
        setVLoadState('error');
        setVForm(EMPTY_TURNO);
        setVDeliveries([]);
        setVClientes([]);
      }
    }
    cargar();
    return () => { cancelado = true; };
  }, [vDate, vTurno, semExcelActual, excelFile, cuentaConectada, isOnline]);

  const [semDetectada, setSemDetectada] = useState(null); // {sem, desde, hasta} | null

  useEffect(() => {
    let cancel = false;
    async function detectar() {
      if (!cuentaConectada || !excelFile) return;
      try {
        const det = await detectarSemana(excelFile.id, vDate, semanasActivas);
        if (cancel) return;
        if (det) {
          setSemDetectada(det);
          setSemExcelActual(det.sem);
        } else {
          // req. 9: la fecha no cae en ninguna semana activa del archivo (ni siquiera Sem5, si
          // el archivo no la tiene) — se avisa claro y NO se toca semExcelActual, para no
          // terminar mostrando/guardando el día en la semana equivocada.
          setSemDetectada(null);
          setSyncMsg({ type: 'error', text: `La fecha ${fmtDate(vDate)} no está contemplada en el archivo mensual conectado (no cae dentro de ninguna semana cargada). Verificá la fecha o conectá el archivo del mes correspondiente.` });
        }
      } catch (e) { /* si falla, se mantiene la selección manual */ }
    }
    detectar();
    return () => { cancel = true; };
  }, [vDate, excelFile, cuentaConectada, semanasActivas]);

  useEffect(() => {
    let cancel = false;
    async function detectar() {
      if (!cuentaConectada || !excelFile || !cForm.fecha) return;
      try {
        const det = await detectarSemana(excelFile.id, cForm.fecha, semanasActivas);
        if (cancel) return;
        if (det) {
          setSemDetectada(det);
          setSemExcelActual(det.sem);
        } else {
          setSemDetectada(null);
          setSyncMsg({ type: 'error', text: `La fecha ${fmtDate(cForm.fecha)} no está contemplada en el archivo mensual conectado (no cae dentro de ninguna semana cargada). Verificá la fecha o conectá el archivo del mes correspondiente.` });
        }
      } catch (e) { /* mantiene selección manual */ }
    }
    detectar();
    return () => { cancel = true; };
  }, [cForm.fecha, excelFile, cuentaConectada, semanasActivas]);

  const conectarExcel = async () => {
    try {
      setSyncMsg({ type: 'loading', text: 'Conectando con Microsoft…' });
      const acc = await ensureLogin();
      // Se pide el token de una vez acá, dentro del mismo toque del usuario que inició la
      // conexión (en vez de dejar que lo pida recién la primera pantalla que necesite datos).
      // Así, cuando el Dashboard/Resumen/Compras se disparan solos apenas hay Excel conectado,
      // el token ya está en caché y no necesitan intentar nada por su cuenta.
      await getGraphToken();
      setCuentaConectada(acc.username);
      setSyncMsg({ type: 'ok', text: 'Conectado como ' + acc.username });
    } catch (e) {
      setSyncMsg({ type: 'error', text: 'No se pudo conectar: ' + e.message });
    }
  };
  const desconectarExcel = () => { logoutExcel(); setCuentaConectada(null); };

  const agregarPendiente = (item) => setPendientes((prev) => [...prev, { id: Date.now().toString() + Math.random(), ...item }]);
  const quitarPendiente = (id) => setPendientes((prev) => prev.filter((p) => p.id !== id));

  const guardandoVentaRef = useRef(false);
  const guardandoCompraRef = useRef(false);
  const guardandoGastoRef = useRef(false);
  // Candado global: serializa TODAS las escrituras a Excel (altas nuevas + reintentos, ventas y
  // compras) para que nunca corran dos operaciones al mismo tiempo contra el mismo archivo. Esto
  // es lo que evita que, con conexión intermitente, un reintento automático y otro manual (o dos
  // reintentos automáticos superpuestos) terminen escribiendo la misma compra en dos filas distintas.
  const excelWriteLockRef = useRef(Promise.resolve());
  const retryingIdsRef = useRef(new Set());
  const syncingAllRef = useRef(false);
  const conLock = (fn) => {
    const run = excelWriteLockRef.current.then(fn, fn);
    excelWriteLockRef.current = run.then(() => {}, () => {});
    return run;
  };

  const registrar = (entrada) => setRegistro((prev) => [{ id: Date.now().toString() + Math.random(), hora: new Date().toISOString(), usuario: cuentaConectada || '(sin conectar)', archivo: excelFile ? excelFile.name : '', semana: semExcelActual, ...entrada }, ...prev].slice(0, 200));

  const guardarVenta = async () => {
    if (guardandoVentaRef.current) return; // req. 7: rechaza doble toque
    guardandoVentaRef.current = true;
    setVSaving(true);
    const opId = 'venta-' + Date.now();
    const snapshot = { dateStr: vDate, semSheet: semExcelActual, turno: vTurno, turnoForm: { ...vForm }, deliveries: [...vDeliveries], deliveriesDirty: vDeliveriesDirty, clientes: [...vClientes], clientesDirty: vClientesDirty };

    // req. 1: modo offline — si no hay señal o no hay Excel conectado, guarda local y encola para sincronizar después
    if (!isOnline || !cuentaConectada || !excelFile) {
      setVentas((prev) => ({
        ...prev,
        [vDate]: {
          ...prev[vDate],
          [vTurno]: { ...vForm },
          deliveries: vDeliveriesDirty ? vDeliveries : (prev[vDate]?.deliveries || []),
          clientes: vClientesDirty ? vClientes : (prev[vDate]?.clientes || []),
        },
      }));
      agregarPendiente({ id: opId, tipo: 'venta', ...snapshot, error: !isOnline ? 'Sin conexión a internet' : 'Excel no conectado' });
      setSyncMsg({ type: 'ok', text: 'Guardado local (sin sincronizar). Se sube solo cuando vuelva la conexión.' });
      registrar({ tipo: 'venta', hoja: 'Ventas', rango: `día ${vDate} (${vTurno})`, estado: 'local', opId });
      guardandoVentaRef.current = false;
      setVSaving(false);
      return;
    }

    setSyncMsg({ type: 'loading', text: 'Sincronizando venta con Excel…' });
    try {
      const { antes, ws, diaActualizado } = await conLock(async () => {
        const r = await excelSyncVentaDia(excelFile.id, semExcelActual, vDate, vTurno, vForm, vDeliveries, vDeliveriesDirty, vClientes, vClientesDirty);
        const d = await leerVentaDia(excelFile.id, semExcelActual, vDate);
        return { ...r, diaActualizado: d };
      });
      setVentas((prev) => ({ ...prev, [vDate]: diaActualizado }));
      setVForm({ ...diaActualizado[vTurno] });
      setVDeliveriesDirty(false);
      setVClientesDirty(false);
      setSyncMsg({ type: 'ok', text: 'Venta sincronizada con el Excel ✓' });
      registrar({ tipo: 'venta', hoja: 'Ventas', rango: `día ${vDate} (${vTurno})`, estado: 'confirmado', opId, ws, antes, deshacerVenceEn: Date.now() + 5 * 60 * 1000 });
    } catch (e) {
      agregarPendiente({ id: opId, tipo: 'venta', ...snapshot, error: e.message });
      setSyncMsg({ type: 'error', text: 'No se sincronizó y quedó pendiente: ' + e.message });
      registrar({ tipo: 'venta', hoja: 'Ventas', rango: `día ${vDate} (${vTurno})`, estado: 'pendiente', opId, error: e.message });
    }
    guardandoVentaRef.current = false;
    setVSaving(false);
  };

  const agregarCompra = async () => {
    if (guardandoCompraRef.current) return; // req. 7
    if (!cForm.proveedor || (cForm.proveedor === 'Otro' && !cForm.proveedorOtro)) {
      setSyncMsg({ type: 'error', text: 'Falta el proveedor.' }); return;
    }
    if (!cForm.tipo || (cForm.tipo === 'Otro' && !cForm.tipoOtro)) {
      setSyncMsg({ type: 'error', text: 'Falta el tipo de compra.' }); return;
    }
    const importeValido = cForm.modo === 'importe' ? parseImporte(cForm.importe) > 0 : parseCantidad(cForm.kg) > 0 && parseImporte(cForm.precioKg) > 0;
    if (!importeValido) {
      setSyncMsg({ type: 'error', text: 'Falta un importe válido.' }); return;
    }
    const proveedorNoOficial = cForm.proveedor === 'Otro';
    const compraFinal = {
      ...cForm,
      proveedor: proveedorNoOficial ? cForm.proveedorOtro : cForm.proveedor,
      tipo: cForm.tipo === 'Otro' ? cForm.tipoOtro : cForm.tipo,
      total: cForm.modo === 'importe' ? parseImporte(cForm.importe) : parseCantidad(cForm.kg) * parseImporte(cForm.precioKg),
    };
    // req.: el proveedor ingresado no coincide con la lista oficial (PROVEEDORES) — se guarda igual,
    // con el nombre real escrito por el usuario, pero avisamos para que sepa que Excel lo va a marcar
    // como no reconocido.
    const avisoProveedor = proveedorNoOficial
      ? ` El proveedor "${compraFinal.proveedor}" no está en la lista oficial y se guardará como tal (no como "Otro").`
      : '';
    guardandoCompraRef.current = true;
    setCSaving(true);
    const opId = 'compra-' + Date.now();

    if (!isOnline || !cuentaConectada || !excelFile) {
      const nuevaLocal = { id: opId, ...compraFinal, pendienteLocal: true };
      setCompras((prev) => [nuevaLocal, ...prev]);
      agregarPendiente({ id: opId, tipo: 'compra', compra: compraFinal, semSheet: semExcelActual, error: !isOnline ? 'Sin conexión a internet' : 'Excel no conectado' });
      setCForm({ fecha: cForm.fecha, modo: 'kg', proveedor: PROVEEDORES[0], proveedorOtro: '', tipo: TIPOS[0], tipoOtro: '', descripcion: '', kg: '', precioKg: '', importe: '', observaciones: '' });
      setSyncMsg({ type: 'ok', text: 'Guardado local (sin sincronizar). Se sube solo cuando vuelva la conexión.' + avisoProveedor });
      registrar({ tipo: 'compra', hoja: 'Compras', rango: '(local, sin fila asignada)', estado: 'local', opId });
      guardandoCompraRef.current = false;
      setCSaving(false);
      return;
    }

    setSyncMsg({ type: 'loading', text: 'Sincronizando compra con Excel…' });
    let filaCapturada = null;
    try {
      const fila = await conLock(() => excelSyncCompra(excelFile.id, semExcelActual, compraFinal, null, (r) => { filaCapturada = r; }));
      const nueva = { id: opId, ...compraFinal, row: fila };
      setCompras((prev) => [nueva, ...prev]);
      setCForm({ fecha: cForm.fecha, modo: 'kg', proveedor: PROVEEDORES[0], proveedorOtro: '', tipo: TIPOS[0], tipoOtro: '', descripcion: '', kg: '', precioKg: '', importe: '', observaciones: '' });
      setSyncMsg({ type: 'ok', text: 'Compra sincronizada con el Excel ✓' + avisoProveedor });
      registrar({ tipo: 'compra', hoja: 'Compras', rango: `fila ${fila}`, estado: 'confirmado', opId, row: fila, fechaSerial: toExcelSerial(compraFinal.fecha), deshacerVenceEn: Date.now() + 5 * 60 * 1000 });
    } catch (e) {
      agregarPendiente({ id: opId, tipo: 'compra', compra: compraFinal, semSheet: semExcelActual, filaAsignada: filaCapturada, error: e.message });
      setSyncMsg({ type: 'error', text: 'No se sincronizó y quedó pendiente: ' + e.message });
      registrar({ tipo: 'compra', hoja: 'Compras', rango: filaCapturada ? `fila ${filaCapturada} (sin confirmar)` : '(sin fila asignada)', estado: 'pendiente', opId, error: e.message });
    }
    guardandoCompraRef.current = false;
    setCSaving(false);
  };

  const agregarGasto = async () => {
    if (guardandoGastoRef.current) return;
    const monto = parseImporte(gForm.monto);
    if (!(monto > 0)) { setSyncMsg({ type: 'error', text: 'Ingresá un monto válido.' }); return; }
    guardandoGastoRef.current = true;
    setGSaving(true);
    const opId = 'gasto-' + Date.now();
    const tipo = gForm.tipo;
    const etiqueta = tipo === 'gasoil' ? 'Gasoil' : 'Otros gastos variables';

    if (!isOnline || !cuentaConectada || !excelFile) {
      setGastosLocal((prev) => ({ ...prev, [selectedWeek]: [{ id: opId, tipo, monto, fecha: todayISO(), pendienteLocal: true }, ...(prev[selectedWeek] || [])] }));
      agregarPendiente({ id: opId, tipo: 'gasto', gasto: { tipo, monto }, semSheet: semExcelActual, error: !isOnline ? 'Sin conexión a internet' : 'Excel no conectado' });
      setGForm({ tipo, monto: '' });
      setSyncMsg({ type: 'ok', text: 'Guardado local (sin sincronizar). Se suma al Excel solo cuando vuelva la conexión.' });
      registrar({ tipo: 'gasto', hoja: 'Resumen', rango: `${celdaGasto(tipo)} (${etiqueta}, local)`, estado: 'local', opId });
      guardandoGastoRef.current = false;
      setGSaving(false);
      return;
    }

    setSyncMsg({ type: 'loading', text: `Sumando ${etiqueta.toLowerCase()} en el Excel…` });
    let baseCapturada = null;
    try {
      const nuevoTotal = await conLock(() => excelSyncGasto(excelFile.id, semExcelActual, tipo, monto, null, (b) => { baseCapturada = b; }));
      setGastosLocal((prev) => ({ ...prev, [selectedWeek]: [{ id: opId, tipo, monto, fecha: todayISO() }, ...(prev[selectedWeek] || [])] }));
      setGForm({ tipo, monto: '' });
      setSyncMsg({ type: 'ok', text: `${etiqueta} sumado ✓ — nuevo total de la semana: ${fmt(nuevoTotal)}` });
      registrar({ tipo: 'gasto', hoja: 'Resumen', rango: `${celdaGasto(tipo)} (${etiqueta})`, estado: 'confirmado', opId });
      cargarResumenExcel();
    } catch (e) {
      agregarPendiente({ id: opId, tipo: 'gasto', gasto: { tipo, monto, baseConocido: baseCapturada }, semSheet: semExcelActual, error: e.message });
      setSyncMsg({ type: 'error', text: 'No se sumó y quedó pendiente: ' + e.message });
      registrar({ tipo: 'gasto', hoja: 'Resumen', rango: `${celdaGasto(tipo)} (${etiqueta}, sin confirmar)`, estado: 'pendiente', opId, error: e.message });
    }
    guardandoGastoRef.current = false;
    setGSaving(false);
  };

  const deshacerEntrada = async (entry) => {
    if (!cuentaConectada || !excelFile) { setSyncMsg({ type: 'error', text: 'Conectá el Excel para deshacer.' }); return; }
    setSyncMsg({ type: 'loading', text: 'Deshaciendo…' });
    try {
      if (entry.tipo === 'venta') {
        const diaActualizado = await conLock(async () => {
          await excelDeshacerVenta(excelFile.id, entry.ws, entry.antes);
          return leerVentaDia(excelFile.id, semExcelActual, vDate);
        });
        if (entry.rango.includes(vDate)) setVentas((prev) => ({ ...prev, [vDate]: diaActualizado }));
      } else {
        await conLock(() => excelDeshacerCompra(excelFile.id, entry.semana, entry.row, entry.fechaSerial));
        setCompras((prev) => prev.filter((c) => c.id !== entry.opId));
      }
      setRegistro((prev) => prev.map((r) => r.id === entry.id ? { ...r, deshecho: true } : r));
      setSyncMsg({ type: 'ok', text: 'Deshecho ✓' });
    } catch (e) {
      setSyncMsg({ type: 'error', text: 'No se pudo deshacer: ' + e.message });
    }
  };

  const reintentarPendiente = async (p) => {
    if (!cuentaConectada || !excelFile) {
      setSyncMsg({ type: 'error', text: 'Conectá el Excel antes de reintentar.' }); return;
    }
    // req. extra: evita que la misma operación pendiente se reintente dos veces en simultáneo
    // (p. ej. el auto-sync por reconexión y un toque manual en "Reintentar" al mismo tiempo).
    if (retryingIdsRef.current.has(p.id)) return;
    retryingIdsRef.current.add(p.id);
    setSyncMsg({ type: 'loading', text: 'Reintentando…' });
    let filaCapturada = p.filaAsignada || null;
    let baseCapturada = p.gasto ? (p.gasto.baseConocido != null ? p.gasto.baseConocido : null) : null;
    try {
      if (p.tipo === 'venta') {
        const { antes, ws, diaActualizado } = await conLock(async () => {
          const r = await excelSyncVentaDia(excelFile.id, p.semSheet, p.dateStr, p.turno, p.turnoForm, p.deliveries, p.deliveriesDirty, p.clientes, p.clientesDirty);
          const d = await leerVentaDia(excelFile.id, p.semSheet, p.dateStr);
          return { ...r, diaActualizado: d };
        });
        setVentas((prev) => ({ ...prev, [p.dateStr]: diaActualizado }));
        registrar({ tipo: 'venta', hoja: 'Ventas', rango: `día ${p.dateStr} (${p.turno})`, estado: 'confirmado', opId: p.id, ws, antes, deshacerVenceEn: Date.now() + 5 * 60 * 1000 });
      } else if (p.tipo === 'gasto') {
        // reintento idempotente: excelSyncGasto compara contra baseConocido para no sumar dos veces
        const nuevoTotal = await conLock(() => excelSyncGasto(excelFile.id, p.semSheet, p.gasto.tipo, p.gasto.monto, p.gasto.baseConocido, (b) => { baseCapturada = b; }));
        setGastosLocal((prev) => {
          const semana = Object.keys(prev).find((w) => (prev[w] || []).some((g) => g.id === p.id));
          if (!semana) return { ...prev, [selectedWeek]: [{ id: p.id, tipo: p.gasto.tipo, monto: p.gasto.monto, fecha: todayISO() }, ...(prev[selectedWeek] || [])] };
          return { ...prev, [semana]: prev[semana].map((g) => g.id === p.id ? { ...g, pendienteLocal: false } : g) };
        });
        registrar({ tipo: 'gasto', hoja: 'Resumen', rango: `${celdaGasto(p.gasto.tipo)} — nuevo total ${fmt(nuevoTotal)}`, estado: 'confirmado', opId: p.id });
      } else {
        // req. 2: reintento idempotente — reusa la fila ya asignada (p.filaAsignada) si la hubo,
        // y el candado (conLock) garantiza que ningún otro reintento toque el Excel al mismo tiempo.
        const fila = await conLock(() => excelSyncCompra(excelFile.id, p.semSheet, p.compra, p.filaAsignada, (r) => { filaCapturada = r; }));
        setCompras((prev) => {
          const yaEstaba = prev.some((c) => c.id === p.id);
          if (yaEstaba) return prev.map((c) => c.id === p.id ? { ...c, row: fila, pendienteLocal: false } : c);
          return [{ id: p.id, ...p.compra, row: fila }, ...prev];
        });
        registrar({ tipo: 'compra', hoja: 'Compras', rango: `fila ${fila}`, estado: 'confirmado', opId: p.id, row: fila, fechaSerial: toExcelSerial(p.compra.fecha), deshacerVenceEn: Date.now() + 5 * 60 * 1000 });
      }
      quitarPendiente(p.id);
      setSyncMsg({ type: 'ok', text: 'Sincronizado ✓' });
    } catch (e) {
      if (p.tipo === 'compra' && filaCapturada && filaCapturada !== p.filaAsignada) {
        setPendientes((prev) => prev.map((x) => x.id === p.id ? { ...x, filaAsignada: filaCapturada, error: e.message } : x));
      }
      if (p.tipo === 'gasto' && baseCapturada != null && baseCapturada !== p.gasto.baseConocido) {
        setPendientes((prev) => prev.map((x) => x.id === p.id ? { ...x, gasto: { ...x.gasto, baseConocido: baseCapturada }, error: e.message } : x));
      }
      setSyncMsg({ type: 'error', text: 'Sigue fallando: ' + e.message });
    }
    retryingIdsRef.current.delete(p.id);
  };

  // req. 1: al volver la conexión, intenta subir solo lo que estaba pendiente por falta de señal
  const sincronizarPendientes = async () => {
    if (!cuentaConectada || !excelFile || pendientes.length === 0) return;
    // evita que dos sincronizaciones masivas corran superpuestas (p. ej. si la señal
    // parpadea y "isOnline" pasa a true varias veces seguidas en pocos segundos)
    if (syncingAllRef.current) return;
    syncingAllRef.current = true;
    try {
      for (const p of pendientes) {
        await reintentarPendiente(p);
      }
    } finally {
      syncingAllRef.current = false;
    }
  };
  useEffect(() => {
    if (isOnline && cuentaConectada && excelFile && pendientes.length > 0) sincronizarPendientes();
  }, [isOnline]);
  const weekDates = useMemo(() => getWeekDates(selectedWeek), [selectedWeek]);
  const weekCompras = useMemo(() => compras.filter((c) => weekDates.includes(c.fecha)), [compras, weekDates]);

  const weekVentasTotales = useMemo(() => {
    let efectivo = 0, noEfectivo = 0;
    const porDia = weekDates.map((d) => {
      const dv = ventas[d];
      efectivo += dayEfectivo(dv);
      noEfectivo += dayNoEfectivo(dv);
      return dayTotal(dv);
    });
    return { efectivo, noEfectivo, total: efectivo + noEfectivo, porDia };
  }, [ventas, weekDates]);

  const totalComprasSemana = useMemo(() => weekCompras.reduce((a, c) => a + c.total, 0), [weekCompras]);
  const pesadaSemana = pesada[selectedWeek] || { inicial: '', final: '', gastos: '' };
  const setPesadaField = (field, value) => setPesada((prev) => ({ ...prev, [selectedWeek]: { ...pesadaSemana, [field]: value } }));

  const cogs = num(pesadaSemana.inicial) + totalComprasSemana - num(pesadaSemana.final);
  const rindeNeto = weekVentasTotales.total - cogs - num(pesadaSemana.gastos);

  // req. 12: visitas = combinaciones únicas de proveedor + fecha, no filas/subproductos
  const proveedorSummary = useMemo(() => {
    const porProveedor = {};
    weekCompras.forEach((c) => {
      const key = c.proveedor;
      if (!porProveedor[key]) porProveedor[key] = { proveedor: key, total: 0, compras: 0, fechas: new Set() };
      porProveedor[key].total += c.total;
      porProveedor[key].compras += 1;
      porProveedor[key].fechas.add(c.fecha);
    });
    return Object.values(porProveedor).map((p) => ({ proveedor: p.proveedor, total: p.total, compras: p.compras, visitas: p.fechas.size }));
  }, [weekCompras]);

  const chartData = weekDates.map((d, i) => ({ dia: DIAS_CORTOS[i], total: weekVentasTotales.porDia[i] }));
  const maxChart = Math.max(1, ...chartData.map((d) => d.total));

  const [resumenExcel, setResumenExcel] = useState(null);
  const [resumenExcelEstado, setResumenExcelEstado] = useState('idle'); // idle|loading|ok|error
  const [resumenExcelHora, setResumenExcelHora] = useState(null);

  const [comprasSync, setComprasSync] = useState('idle'); // idle|loading|error
  const [comprasHuerfanas, setComprasHuerfanas] = useState([]); // filas con datos pero sin fecha (req. urgente: detectar corrupción)
  const actualizarComprasDesdeExcel = async () => {
    if (!cuentaConectada || !excelFile) { setSyncMsg({ type: 'error', text: 'Conectá el Excel primero.' }); return; }
    setComprasSync('loading');
    try {
      const desdeExcel = await conReintentoAuto(() => excelLeerComprasSemana(excelFile.id, semExcelActual));
      setCompras((prev) => {
        // saca las compras locales de esta semana (por fecha dentro del rango visible) y pone las reales de Excel
        const otrasSemanas = prev.filter((c) => !weekDates.includes(c.fecha));
        return [...desdeExcel, ...otrasSemanas];
      });
      setComprasHuerfanas(desdeExcel.huerfanas || []);
      const avisoHuerfanas = (desdeExcel.huerfanas || []).length > 0
        ? ` ⚠️ Hay ${desdeExcel.huerfanas.length} fila${desdeExcel.huerfanas.length === 1 ? '' : 's'} con datos pero sin fecha (revisalas más abajo).`
        : '';
      setSyncMsg({ type: (desdeExcel.huerfanas || []).length > 0 ? 'error' : 'ok', text: `Compras actualizadas desde Excel (${desdeExcel.length} filas) ✓${avisoHuerfanas}` });
      setComprasSync('idle');
    } catch (e) {
      setSyncMsg({ type: 'error', text: 'No se pudo leer Compras: ' + e.message });
      setComprasSync('error');
    }
  };

  const [dashDate, setDashDate] = useState(todayISO());
  const [dashData, setDashData] = useState(null);
  const [dashEstado, setDashEstado] = useState('idle'); // idle|loading|ok|error
  const [dashHora, setDashHora] = useState(null);

  const cargarDashboardDiario = async () => {
    if (!cuentaConectada || !excelFile) return;
    setDashEstado('loading');
    try {
      const { det, dia, comprasSemana } = await conReintentoAuto(async () => {
        const det = await detectarSemana(excelFile.id, dashDate, semanasActivas);
        if (!det) throw new Error('La fecha no está contemplada en el archivo mensual conectado (no cae dentro de ninguna semana cargada).');
        const [dia, comprasSemana] = await Promise.all([
          leerVentaDia(excelFile.id, det.sem, dashDate),
          excelLeerComprasSemana(excelFile.id, det.sem),
        ]);
        return { det, dia, comprasSemana };
      });
      const comprasDia = comprasSemana.filter((c) => c.fecha === dashDate);
      setDashData({
        sem: det.sem,
        ventasTotal: dayTotal(dia),
        efectivo: dayEfectivo(dia),
        transferencias: dayNoEfectivo(dia),
        delivery: deliveriesTotal(dia.deliveries),
        clientesCobrado: clientesCobradoTotal(dia.clientes),
        clientesPendiente: clientesPendienteTotal(dia.clientes),
        comprasTotal: comprasDia.reduce((a, c) => a + c.total, 0),
        comprasCantidad: comprasDia.length,
      });
      setDashHora(new Date());
      setDashEstado('ok');
    } catch (e) {
      setDashEstado('error');
    }
  };

  useEffect(() => {
    if (tab === 'resumen' && cuentaConectada && excelFile) cargarDashboardDiario();
  }, [tab, dashDate, excelFile, cuentaConectada]);

  const cargarResumenExcel = async () => {
    if (!cuentaConectada || !excelFile) return;
    setResumenExcelEstado('loading');
    try {
      const { r, ventasTotales, pendientes } = await conReintentoAuto(async () => {
        await verificarArchivoConectado(excelFile);
        const [r, ventasTotales, pendientes] = await Promise.all([
          excelLeerResumen(excelFile.id, semExcelActual),
          excelLeerVentasTotales(excelFile.id, semExcelActual),
          excelLeerClientesPendientes(excelFile.id),
        ]);
        return { r, ventasTotales, pendientes };
      });
      setResumenExcel({ ...r, ventasTotales, clientesPendientes: pendientes.total, clientesPendientesLista: pendientes.lista, resultado: ventasTotales - r.cogs });
      setResumenExcelHora(new Date());
      setResumenExcelEstado('ok');
    } catch (e) {
      if (e.message === 'ARCHIVO_NO_ENCONTRADO') setExcelFile(null);
      setResumenExcelEstado('error');
    }
  };

  useEffect(() => {
    if ((tab === 'resumen' || tab === 'stock' || tab === 'gastos') && cuentaConectada && excelFile) cargarResumenExcel();
  }, [tab, semExcelActual, excelFile, cuentaConectada]);

  // req. urgente: chequea automáticamente si hay filas huérfanas (datos sin fecha) apenas se entra
  // a la pestaña de Compras o se conecta el Excel, para no depender de que el usuario toque "Actualizar".
  useEffect(() => {
    if (tab === 'compras' && cuentaConectada && excelFile) actualizarComprasDesdeExcel();
  }, [tab, semExcelActual, excelFile, cuentaConectada]);

  if (!loaded) {
    return React.createElement('div', { style: { background: '#F3E9DC', minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' } },
      React.createElement('p', { style: { fontFamily: 'Inter, sans-serif', color: '#7A2331' } }, 'Cargando…'));
  }

  return (
    <div style={styles.app}>
      <header style={styles.header}>
        <img src={LOGO_B64} alt="Carnicería Tony" style={styles.logo} />
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontFamily: 'Inter, sans-serif', fontSize: 11, color: '#D8CBB8' }}>
            {cuentaConectada ? <Cloud size={14} color="#8FBF7A" /> : <CloudOff size={14} color="#D8CBB8" />}
            {cuentaConectada ? 'Excel conectado' : 'Excel no conectado'}
          </div>
          <button
            onClick={() => setDarkMode((d) => !d)}
            aria-label={darkMode ? 'Modo claro' : 'Modo oscuro'}
            style={{ background: 'rgba(255,255,255,0.12)', border: 'none', borderRadius: 8, padding: 6, display: 'flex', cursor: 'pointer', color: '#F0E6D2' }}
          >
            {darkMode ? <Sun size={15} /> : <Moon size={15} />}
          </button>
        </div>
      </header>

      {syncMsg && (
        <div style={{
          padding: '8px 16px', fontFamily: 'Inter, sans-serif', fontSize: 12, display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          background: syncMsg.type === 'error' ? '#F4D9D3' : syncMsg.type === 'ok' ? '#DCEBD3' : '#F0E6D2',
          color: syncMsg.type === 'error' ? '#8A3423' : syncMsg.type === 'ok' ? '#3B5C2A' : '#7A5B23',
        }}>
          <span>{syncMsg.text}</span>
          <button onClick={() => setSyncMsg(null)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'inherit' }}><X size={14} /></button>
        </div>
      )}

      <main style={styles.main}>
        {tab === 'resumen' && (
          <div style={styles.screen}>
            <EstadoDeHoy
              dashData={dashData}
              dashEstado={dashEstado}
              dashHora={dashHora}
              resumenExcel={resumenExcel}
              resumenExcelEstado={resumenExcelEstado}
              pendientes={pendientes}
              cuentaConectada={cuentaConectada}
              excelFile={excelFile}
              comprasHuerfanas={comprasHuerfanas}
            />
            <SectionLabel text="Dashboard diario" />
            <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 10 }}>
              <input type="date" value={dashDate} onChange={(e) => setDashDate(e.target.value)} style={{ ...styles.input, flex: 1 }} />
              <button onClick={cargarDashboardDiario} disabled={dashEstado === 'loading' || !cuentaConectada || !excelFile} style={{ ...styles.segBtn, padding: '8px 12px' }}>
                {dashEstado === 'loading' ? '…' : 'Actualizar'}
              </button>
            </div>
            {(!cuentaConectada || !excelFile) && (
              <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, color: '#8A3423', background: '#F4D9D3', padding: 10, borderRadius: 8 }}>
                Excel no conectado. El dashboard diario necesita la planilla conectada.
              </p>
            )}
            {dashEstado === 'error' && (
              <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, color: '#8A3423', background: '#F4D9D3', padding: 10, borderRadius: 8 }}>
                No se pudo leer ese día del Excel (revisá que la fecha esté dentro de alguna semana cargada).
              </p>
            )}
            {dashData && dashEstado === 'ok' && (
              <>
                <div style={styles.cardRow}>
                  <MiniCard label="Ventas totales" value={fmt(dashData.ventasTotal)} />
                  <MiniCard label="Compras" value={fmt(dashData.comprasTotal)} />
                </div>
                <div style={styles.cardRow}>
                  <MiniCard label="Efectivo" value={fmt(dashData.efectivo)} small />
                  <MiniCard label="Digital" value={fmt(dashData.transferencias)} small />
                </div>
                <div style={styles.cardRow}>
                  <MiniCard label="Delivery" value={fmt(dashData.delivery)} small />
                  <MiniCard label="Clientes especiales (cobrado)" value={fmt(dashData.clientesCobrado)} small />
                </div>
                {dashData.clientesPendiente > 0 && (
                  <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 11, color: '#8A3423' }}>Clientes especiales pendientes de cobro hoy: {fmt(dashData.clientesPendiente)}</p>
                )}
                <p style={styles.footnote}>{dashData.comprasCantidad} compra{dashData.comprasCantidad !== 1 ? 's' : ''} cargada{dashData.comprasCantidad !== 1 ? 's' : ''} este día · hoja {dashData.sem} · datos leídos en vivo del Excel.</p>
              </>
            )}

            <SectionLabel text="Semana" />
            <WeekPicker selectedWeek={selectedWeek} setSelectedWeek={setSelectedWeek} />
            {cuentaConectada && excelFile ? (
              <>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                  <span style={{ fontFamily: 'Inter, sans-serif', fontSize: 11, color: '#8A7C6B' }}>
                    {resumenExcelEstado === 'loading' ? 'Actualizando desde Excel…' : resumenExcelHora ? `Actualizado ${resumenExcelHora.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' })}` : ''}
                  </span>
                  <button onClick={cargarResumenExcel} style={{ ...styles.segBtn, padding: '4px 10px', fontSize: 11 }}>Actualizar</button>
                </div>
                {resumenExcelEstado === 'error' && <p style={{ color: '#8A3423', fontFamily: 'Inter, sans-serif', fontSize: 12 }}>No se pudo leer el Resumen de Excel. Los números de abajo pueden no ser los oficiales.</p>}
                {resumenExcel && (
                  <>
                    <div style={styles.stampWrap}>
                      {resumenExcel.existenciaFinalPendiente ? (
                        <div style={{ ...styles.stamp, background: '#F4EBDD', borderColor: '#B08D57', color: '#8A6D3B' }}>
                          <div style={{ fontSize: 11, letterSpacing: 1.5, fontFamily: 'Inter, sans-serif', fontWeight: 700 }}>RINDE BRUTO SEMANAL</div>
                          <div style={{ fontFamily: 'Oswald, sans-serif', fontSize: 17, fontWeight: 700, lineHeight: 1.3 }}>Pendiente de pesada</div>
                          <div style={{ fontFamily: 'Inter, sans-serif', fontSize: 11, fontWeight: 500, marginTop: 2 }}>Falta cargar la existencia final para calcularlo</div>
                        </div>
                      ) : (
                        <div style={{ ...styles.stamp, background: resumenExcel.resultado >= 0 ? '#E3F1DD' : '#FBE1DC', borderColor: resumenExcel.resultado >= 0 ? '#1E7A34' : '#C0392B', color: resumenExcel.resultado >= 0 ? '#1E7A34' : '#C0392B' }}>
                          <div style={{ fontSize: 11, letterSpacing: 1.5, fontFamily: 'Inter, sans-serif', fontWeight: 700 }}>RINDE BRUTO SEMANAL</div>
                          <div style={{ fontFamily: 'Oswald, sans-serif', fontSize: 30, fontWeight: 700, lineHeight: 1.1 }}>{fmt(resumenExcel.resultado)}</div>
                        </div>
                      )}
                    </div>
                    <div style={styles.cardRow}>
                      <MiniCard label="Ventas totales (Excel)" value={fmt(resumenExcel.ventasTotales)} />
                      <MiniCard label="Compras (Excel)" value={fmt(resumenExcel.totalCompras)} />
                    </div>
                    <div style={styles.cardRow}>
                      <MiniCard label="Efectivo" value={fmt(resumenExcel.ventasEfectivo)} small />
                      <MiniCard label="Digital" value={fmt(resumenExcel.ventasDigital)} small />
                    </div>
                    <SectionLabel text="Detalle (oficial del Excel)" />
                    <DetailRow label="Existencia inicial" value={fmt(resumenExcel.existenciaInicial)} />
                    <DetailRow
                      label="Existencia final"
                      value={resumenExcel.existenciaFinalPendiente ? 'Pendiente de pesada' : fmt(resumenExcel.existenciaFinal)}
                      muted={resumenExcel.existenciaFinalPendiente}
                    />
                    <DetailRow
                      label="Costo mercadería vendida (COGS)"
                      value={resumenExcel.existenciaFinalPendiente ? '—' : fmt(resumenExcel.cogs)}
                      muted={resumenExcel.existenciaFinalPendiente}
                    />
                    <DetailRow label="Gastos operativos" value={fmt(resumenExcel.gastosOperativos)} />
                    <DetailRow label="Clientes pendientes de cobro (todas las semanas)" value={fmt(resumenExcel.clientesPendientes)} />
                    <p style={styles.footnote}>El Rinde Bruto Semanal es Ventas totales − COGS, donde el COGS (Existencia inicial + Compras − Existencia final) es el oficial que ya calcula el Excel. Es un número orientativo de la app: no incluye gastos operativos, impuestos, retiros ni prenda — el rinde neto real lo calcula el Excel en la hoja Resumen (Liquidación). Hasta que se cargue la existencia final de la semana, el indicador queda pendiente en vez de mostrar un número incompleto.</p>
                  </>
                )}
                <CierreSemanalChecklist
                  selectedWeek={selectedWeek}
                  cierreManual={cierreManual}
                  toggleCierreItem={toggleCierreItem}
                  resumenExcel={resumenExcel}
                  resumenExcelEstado={resumenExcelEstado}
                  pendientes={pendientes}
                />
              </>
            ) : (
              <>
                <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, color: '#8A3423', background: '#F4D9D3', padding: 10, borderRadius: 8 }}>
                  Excel no conectado — estos números son solo un cálculo local aproximado, no el resultado oficial. Conectá el Excel en Ajustes.
