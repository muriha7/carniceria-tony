// req.: recordatorio de clientes especiales que todavía no pagaron, juntando TODAS las semanas
// del mes (no solo la que estás trabajando ahora). Sale de "Cuentas por Cobrar", que ya lista
// solo pendientes reales (un cliente sale de esta lista recién cuando se le completa la Semana
// de Cobro en esa hoja). Es puramente informativo — no participa de ningún cálculo de rinde.
function RecordatorioCobros({ lista, estado }) {
  if (estado === 'loading' && !lista) {
    return (
      <div style={{ marginTop: 16, paddingTop: 12, borderTop: '1px dashed #E4D8C7' }}>
        <SectionLabel text="🚨 Recordatorio: cobros pendientes" />
        <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, color: '#8A7C6B' }}>Buscando en Cuentas por Cobrar…</p>
      </div>
    );
  }
  if (!lista) return null; // todavía no cargó nada (sin Excel conectado, etc.)
  const total = lista.reduce((a, c) => a + c.monto, 0);
  return (
    <div style={{ marginTop: 16, paddingTop: 12, borderTop: '1px dashed #E4D8C7' }}>
      <SectionLabel text="🚨 Recordatorio: cobros pendientes (todo el mes)" />
      {lista.length === 0 ? (
        <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, color: '#3B5C2A' }}>No hay clientes especiales pendientes de cobro en ninguna semana del mes. ✓</p>
      ) : (
        <div style={{ background: '#F4D9D3', border: '1px solid #C0392B', borderRadius: 12, padding: '12px 14px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 8 }}>
            <span style={{ fontFamily: 'Inter, sans-serif', fontSize: 11, fontWeight: 700, color: '#8A3423', textTransform: 'uppercase', letterSpacing: 0.5 }}>⚠️ {lista.length} pendiente{lista.length === 1 ? '' : 's'}</span>
            <span style={{ fontFamily: 'IBM Plex Mono, monospace', fontSize: 14, fontWeight: 700, color: '#8A3423' }}>{fmt(total)}</span>
          </div>
          {lista.map((c, i) => (
            <div key={i} style={{ display: 'flex', justifyContent: 'space-between', padding: '5px 0', borderTop: i > 0 ? '1px solid #E3A99C' : 'none' }}>
              <span style={{ fontFamily: 'Inter, sans-serif', fontSize: 12.5, color: '#8A3423' }}>{c.cliente} <span style={{ color: '#B05A4D', fontSize: 11 }}>({c.semana})</span></span>
              <span style={{ fontFamily: 'IBM Plex Mono, monospace', fontSize: 12.5, fontWeight: 600, color: '#8A3423' }}>{fmt(c.monto)}</span>
            </div>
          ))}
          <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 10.5, color: '#B05A4D', marginTop: 8, marginBottom: 0 }}>Solo a modo de recordatorio — no afecta el rinde de la semana. Un cliente sale de esta lista cuando le completás "Semana de Cobro" en Cuentas por Cobrar.</p>
        </div>
      )}
    </div>
  );
}

function CierreSemanalChecklist({ selectedWeek, cierreManual, toggleCierreItem, resumenExcel, resumenExcelEstado, pendientes }) {
  const manual = cierreManual[selectedWeek] || {};

  // Ítems automáticos: se verifican solos con datos reales de la app, no se pueden marcar a mano.
  const existenciaFinalCargada = !!(resumenExcel && !resumenExcel.existenciaFinalPendiente);
  const sinPendientesSync = pendientes.length === 0;
  const resultadoOficialActualizado = resumenExcelEstado === 'ok' && !!(resumenExcel && !resumenExcel.existenciaFinalPendiente);

  const items = [
    { key: 'ventas7dias', label: 'Ventas de los 7 días cargadas', auto: false, checked: !!manual.ventas7dias },
    { key: 'comprasSync', label: 'Compras sincronizadas', auto: false, checked: !!manual.comprasSync },
    { key: 'gastosVariables', label: 'Gastos variables cargados', auto: false, checked: !!manual.gastosVariables },
    { key: 'existenciaFinal', label: 'Existencia final cargada', auto: true, checked: existenciaFinalCargada, sub: existenciaFinalCargada ? undefined : 'Falta la pesada final de la semana' },
    { key: 'clientesRevisados', label: 'Clientes pendientes revisados', auto: false, checked: !!manual.clientesRevisados },
    { key: 'sinPendientes', label: 'No existen operaciones pendientes de sincronizar', auto: true, checked: sinPendientesSync, sub: sinPendientesSync ? undefined : `${pendientes.length} operación${pendientes.length === 1 ? '' : 'es'} sin sincronizar` },
    { key: 'resultadoOficial', label: 'Resultado oficial actualizado', auto: true, checked: resultadoOficialActualizado },
  ];

  const todoListo = items.every((it) => it.checked);

  return (
    <>
      <SectionLabel text="Cierre semanal" />
      <div style={{ background: '#FFFFFF', border: '1px solid #E4D8C7', borderRadius: 10, padding: '2px 14px', marginBottom: 10 }}>
        {items.map((it) => (
          <ChecklistItem
            key={it.key}
            checked={it.checked}
            label={it.label}
            sub={it.sub}
            auto={it.auto}
            onClick={() => toggleCierreItem(it.key)}
          />
        ))}
      </div>
      {todoListo ? (
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, background: '#E3F1DD', border: '1.5px solid #1E7A34', borderRadius: 10, padding: '12px 10px', marginBottom: 10 }}>
          <span style={{ fontFamily: 'Oswald, sans-serif', fontSize: 15, fontWeight: 700, color: '#1E7A34', letterSpacing: 0.3 }}>✓ Semana cerrada correctamente</span>
        </div>
      ) : (
        <p style={styles.footnote}>Los ítems marcados AUTO se verifican solos con datos reales de la app. El resto lo tildás vos a medida que cerrás la semana — queda guardado en este dispositivo.</p>
      )}
    </>
  );
}

function VentasTab({ vDate, setVDate, vTurno, setVTurno, vForm, setVForm, vDeliveries, setVDeliveries, setVDeliveriesDirty, vClientes, setVClientes, setVClientesDirty, guardarVenta, ventas, vLoadState, vSaving, cuentaConectada, excelFile, isOnline }) {
  const set = (field) => (e) => setVForm((p) => ({ ...p, [field]: e.target.value }));
  const totalTurno = mostradorTotal(vForm);
  const totalDia = dayTotal(ventas[vDate]);
  const recientes = Object.keys(ventas).sort((a, b) => b.localeCompare(a)).slice(0, 8);
  const day = weekdayIdx(vDate); // 0=Lun ... 6=Dom
  const esDomingo = day === 6;
  const hayDelivery = day <= 4; // Lun-Vie
  const hayClientes = day <= 5; // Lun-Sáb
  const puedeGuardar = !vSaving;

  const setDeliv = (i, field) => (e) => { setVDeliveriesDirty(true); setVDeliveries((prev) => { const arr = [...prev]; arr[i] = { ...(arr[i] || EMPTY_DELIVERY), [field]: e.target.value }; return arr; }); };
  const addDeliv = () => { setVDeliveriesDirty(true); setVDeliveries((prev) => prev.length >= 5 ? prev : [...prev, { ...EMPTY_DELIVERY }]); };
  const rmDeliv = (i) => { setVDeliveriesDirty(true); setVDeliveries((prev) => prev.filter((_, idx) => idx !== i)); };

  const setCli = (i, field) => (e) => { setVClientesDirty(true); setVClientes((prev) => { const arr = [...prev]; const val = field === 'cobrado' ? e.target.checked : e.target.value; arr[i] = { ...(arr[i] || EMPTY_CLIENTE), [field]: val }; return arr; }); };
  const addCli = () => { setVClientesDirty(true); setVClientes((prev) => prev.length >= 8 ? prev : [...prev, { ...EMPTY_CLIENTE }]); };
  const rmCli = (i) => { setVClientesDirty(true); setVClientes((prev) => prev.filter((_, idx) => idx !== i)); };

  return (
    <div style={styles.screen}>
      <SectionLabel text="Cargar venta" />
      {!isOnline && (
        <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, color: '#7A5B23', background: '#F0E6D2', padding: 10, borderRadius: 8 }}>
          Sin conexión a internet. Podés seguir cargando — se guarda en el teléfono y se sube solo cuando vuelva la señal.
        </p>
      )}
      {isOnline && (!cuentaConectada || !excelFile) && (
        <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, color: '#7A5B23', background: '#F0E6D2', padding: 10, borderRadius: 8 }}>
          Excel no conectado. Se guarda local por ahora — conectalo en Ajustes para sincronizar.
        </p>
      )}

      {cuentaConectada && excelFile && isOnline && vLoadState === 'reading' && (
        <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, color: '#7A5B23', background: '#F0E6D2', padding: 10, borderRadius: 8 }}>Leyendo lo que ya hay cargado en Excel para este día…</p>
      )}
      {cuentaConectada && excelFile && isOnline && vLoadState === 'error' && (
        <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, color: '#8A3423', background: '#F4D9D3', padding: 10, borderRadius: 8 }}>No se pudo leer el Excel para este día. Podés guardar igual: queda pendiente y se revisa al sincronizar.</p>
      )}

      <div style={styles.formCard}>
        <label style={styles.label}>Fecha</label>
        <input type="date" value={vDate} onChange={(e) => setVDate(e.target.value)} style={styles.input} />

        <div style={styles.fieldGroupLabel}>Mostrador — por turno</div>
        <div style={styles.segmented}>
          <button onClick={() => setVTurno('manana')} style={{ ...styles.segBtn, ...(vTurno === 'manana' ? styles.segBtnActive : {}) }}><Sun size={14} /> Mañana</button>
          <button onClick={() => !esDomingo && setVTurno('tarde')} disabled={esDomingo} style={{ ...styles.segBtn, ...(vTurno === 'tarde' ? styles.segBtnActive : {}), ...(esDomingo ? { opacity: 0.4 } : {}) }}><Moon size={14} /> Tarde</button>
        </div>
        {esDomingo && <p style={styles.footnote}>Domingo el local trabaja solo por la mañana.</p>}
        <div style={styles.twoCol}>
          <Field label="Efectivo" value={vForm.mostradorEf} onChange={set('mostradorEf')} />
          <Field label="Tarjeta/MP" value={vForm.mostradorTj} onChange={set('mostradorTj')} />
        </div>
        <p style={styles.footnote}>Dejá un campo vacío si no lo cargaste — así no se pisa lo que ya está en Excel.</p>

        {hayDelivery && (
          <>
            <div style={styles.fieldGroupLabel}>Delivery del día ({vDeliveries.length}/5)</div>
            {vDeliveries.map((d, i) => (
              <div key={i} style={{ display: 'flex', gap: 8, alignItems: 'flex-end', marginBottom: 6 }}>
                <div style={{ flex: 1 }}><Field label={`Delivery ${i + 1} — Efect.`} value={d.ef} onChange={setDeliv(i, 'ef')} /></div>
                <div style={{ flex: 1 }}><Field label="Transfe." value={d.tr} onChange={setDeliv(i, 'tr')} /></div>
                <button onClick={() => rmDeliv(i)} style={{ ...styles.deleteBtn, marginBottom: 9 }}><Trash2 size={16} /></button>
              </div>
            ))}
            {vDeliveries.length < 5 && (
              <button onClick={addDeliv} style={{ ...styles.segBtn, width: '100%', marginTop: 2 }}><Plus size={14} style={{ marginRight: 4, verticalAlign: -2 }} />Agregar delivery</button>
            )}
          </>
        )}

        {hayClientes && (
          <>
            <div style={styles.fieldGroupLabel}>Clientes especiales del día ({vClientes.length}/8)</div>
            {vClientes.map((c, i) => (
              <div key={i} style={{ background: '#FBF7F1', border: '1px solid #E4D8C7', borderRadius: 8, padding: 10, marginBottom: 8 }}>
                <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                  <input type="text" placeholder="Nombre del cliente" value={c.nombre} onChange={setCli(i, 'nombre')} style={{ ...styles.input, fontFamily: 'Inter, sans-serif', flex: 1 }} />
                  <button onClick={() => rmCli(i)} style={styles.deleteBtn}><Trash2 size={16} /></button>
                </div>
                <div style={{ display: 'flex', gap: 8, marginTop: 6 }}>
                  <div style={{ flex: 1 }}><Field label="Efectivo" value={c.ef} onChange={setCli(i, 'ef')} /></div>
                  <div style={{ flex: 1 }}><Field label="Transfe." value={c.tr} onChange={setCli(i, 'tr')} /></div>
                </div>
                <label style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 8, fontFamily: 'Inter, sans-serif', fontSize: 12, color: '#5A4E42' }}>
                  <input type="checkbox" checked={!!c.cobrado} onChange={setCli(i, 'cobrado')} />
                  ¿Cobrado?
                </label>
              </div>
            ))}
            {vClientes.length < 8 && (
              <button onClick={addCli} style={{ ...styles.segBtn, width: '100%', marginTop: 2 }}><Plus size={14} style={{ marginRight: 4, verticalAlign: -2 }} />Agregar cliente</button>
            )}
            <p style={styles.footnote}>Delivery y clientes especiales solo se sincronizan si tocás algo acá — si no, no se modifican en Excel.</p>
          </>
        )}

        <div style={styles.totalLine}>
          <span style={{ fontFamily: 'Inter, sans-serif', fontSize: 13, fontWeight: 700, color: '#5A4E42' }}>TOTAL DE ESTE TURNO</span>
          <span style={{ fontFamily: 'Oswald, sans-serif', fontSize: 20, fontWeight: 700, color: '#7A2331' }}>{fmt(totalTurno)}</span>
        </div>
        <div style={{ ...styles.totalLine, borderTop: 'none', paddingTop: 0 }}>
          <span style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, color: '#8A7C6B' }}>TOTAL ACUMULADO DEL DÍA</span>
          <span style={{ fontFamily: 'IBM Plex Mono, monospace', fontSize: 14, fontWeight: 700, color: '#8A7C6B' }}>{fmt(totalDia)}</span>
        </div>
        <button onClick={guardarVenta} disabled={!puedeGuardar} style={{ ...styles.primaryBtn, ...(!puedeGuardar ? { opacity: 0.5, cursor: 'not-allowed' } : {}) }}>
          {vSaving ? 'Guardando…' : 'Guardar venta'}
        </button>
      </div>
      <SectionLabel text="Últimos días cargados" />
      {recientes.length === 0 && <p style={styles.emptyText}>Todavía no cargaste ninguna venta.</p>}
      {recientes.map((d) => (
        <div key={d} style={styles.listRow} onClick={() => setVDate(d)}>
          <span style={{ fontFamily: 'IBM Plex Mono, monospace', fontSize: 13, color: '#2A211C', fontWeight: 600 }}>{fmtDate(d)}</span>
          <span style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, color: '#8A7C6B' }}>{ventas[d]?.manana ? 'Mañana ' : ''}{ventas[d]?.tarde ? 'Tarde' : ''}</span>
          <span style={{ fontFamily: 'IBM Plex Mono, monospace', fontSize: 13, fontWeight: 700, color: '#7A2331' }}>{fmt(dayTotal(ventas[d]))}</span>
        </div>
      ))}
    </div>
  );
}

function AjustesTab({ excelFile, setExcelFile, semExcelActual, setSemExcelActual, cuentaConectada, conectarExcel, desconectarExcel, selectedWeek, setSyncMsg, pendientes, reintentarPendiente, quitarPendiente, registro, semDetectada, isOnline, sincronizarPendientes, deshacerEntrada, semanasActivas, setSemanasActivas }) {
  const [busqueda, setBusqueda] = useState('');
  const [candidatos, setCandidatos] = useState(null);
  const [buscando, setBuscando] = useState(false);
  const [verificando, setVerificando] = useState(false);

  const buscar = async () => {
    setBuscando(true);
    setCandidatos(null);
    try {
      const res = await buscarCandidatosExcel(busqueda);
      setCandidatos(res);
      if (res.length === 0) setSyncMsg({ type: 'error', text: 'No encontré ningún .xlsx con ese nombre en tu OneDrive.' });
    } catch (e) {
      setSyncMsg({ type: 'error', text: 'Error buscando: ' + e.message });
    }
    setBuscando(false);
  };

  const elegir = async (item) => {
    setVerificando(true);
    setSyncMsg({ type: 'loading', text: 'Revisando que el archivo tenga la estructura esperada…' });
    try {
      // req.: verificarEstructuraArchivo ahora también detecta si el archivo tiene Sem5 además
      // de las 4 de siempre, y devuelve la lista real de semanas con las que va a trabajar la app.
      const semanas = await verificarEstructuraArchivo(item.id);
      setExcelFile(item);
      setSemanasActivas(semanas);
      setCandidatos(null);
      setBusqueda('');
      const avisoSem5 = semanas.includes('Sem5') ? ' (incluye Sem5)' : '';
      setSyncMsg({ type: 'ok', text: `Archivo conectado: ${item.name}${avisoSem5}` });
    } catch (e) {
      setSyncMsg({ type: 'error', text: 'El archivo seleccionado no corresponde a una plantilla compatible o su estructura fue modificada.' });
    }
    setVerificando(false);
  };

  return (
    <div style={styles.screen}>
      <div style={{
        display: 'flex', alignItems: 'center', gap: 8, padding: '8px 12px', borderRadius: 8, marginBottom: 14,
        background: isOnline ? '#DCEBD3' : '#F0E6D2', color: isOnline ? '#3B5C2A' : '#7A5B23', fontFamily: 'Inter, sans-serif', fontSize: 12, fontWeight: 600,
      }}>
        {isOnline ? <Cloud size={14} /> : <CloudOff size={14} />}
        {isOnline ? 'Con conexión a internet' : 'Sin conexión — modo offline activo'}
      </div>
      <SectionLabel text="Conexión con Excel 365" />
      <div style={styles.formCard}>
        {cuentaConectada ? (
          <>
            <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 13, color: '#3B5C2A', marginTop: 0 }}>Conectado como {cuentaConectada}</p>
            <button onClick={desconectarExcel} style={{ ...styles.segBtn, width: '100%' }}>Desconectar</button>
          </>
        ) : (
          <button onClick={conectarExcel} style={styles.primaryBtn}><LogIn size={16} style={{ marginRight: 6, verticalAlign: -3 }} />Conectar con Microsoft</button>
        )}

        <div style={styles.fieldGroupLabel}>Archivo Excel conectado</div>
        {excelFile ? (
          <div style={{ background: '#DCEBD3', border: '1px solid #B7D6A6', borderRadius: 8, padding: 10, marginBottom: 8 }}>
            <div style={{ fontFamily: 'Inter, sans-serif', fontSize: 13, fontWeight: 700, color: '#3B5C2A' }}>{excelFile.name}</div>
            <div style={{ fontFamily: 'IBM Plex Mono, monospace', fontSize: 11, color: '#5A4E42', wordBreak: 'break-all' }}>{excelFile.path}</div>
          </div>
        ) : (
          <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, color: '#8A3423' }}>No hay ningún archivo conectado todavía.</p>
        )}
        <label style={styles.label}>{excelFile ? 'Cambiar de archivo (buscar otro)' : 'Buscar tu archivo del mes'}</label>
        <div style={{ display: 'flex', gap: 8 }}>
          <input type="text" placeholder="Ej: Carniceria Agosto" value={busqueda} onChange={(e) => setBusqueda(e.target.value)} style={{ ...styles.input, fontFamily: 'Inter, sans-serif', flex: 1 }} />
          <button onClick={buscar} disabled={buscando || !cuentaConectada} style={{ ...styles.segBtn, opacity: (!cuentaConectada) ? 0.5 : 1 }}>{buscando ? '…' : 'Buscar'}</button>
        </div>
        {candidatos && candidatos.length > 0 && (
          <div style={{ marginTop: 8 }}>
            {candidatos.map((c) => (
              <div key={c.id} onClick={() => !verificando && elegir(c)} style={{ ...styles.listRow, cursor: verificando ? 'default' : 'pointer', opacity: verificando ? 0.6 : 1 }}>
                <div>
                  <div style={{ fontFamily: 'Inter, sans-serif', fontSize: 13, fontWeight: 600 }}>{c.name}</div>
                  <div style={{ fontFamily: 'IBM Plex Mono, monospace', fontSize: 10, color: '#8A7C6B', wordBreak: 'break-all' }}>{c.path}</div>
                </div>
              </div>
            ))}
            {verificando && <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, color: '#7A5B23' }}>Revisando hojas y rangos…</p>}
          </div>
        )}
        <p style={styles.footnote}>La app nunca elige un archivo sola: siempre lo seleccionás vos de la lista. Antes de conectarlo, revisa que tenga las semanas Sem1 a Sem4 (Pesada/Ventas/Compras/Resumen) y la hoja Cuentas por Cobrar. Si el mes tiene una Sem5 completa, la app la detecta sola — no hace falta nada especial.</p>

        <label style={styles.label}>Hoja del Excel para la semana actual ({fmtDate(selectedWeek)})</label>
        <select value={semExcelActual} onChange={(e) => setSemExcelActual(e.target.value)} style={styles.input}>
          {semanasActivas.map((s) => <option key={s} value={s}>{s}</option>)}
        </select>
        {semanasActivas.includes('Sem5') && (
          <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 11, color: '#3B5C2A', marginTop: -4 }}>Este archivo tiene 5 semanas — Sem5 está disponible en todas las pantallas.</p>
        )}
        {semDetectada ? (
          <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, color: '#3B5C2A' }}>
            Detectada automáticamente por la fecha: {semDetectada.sem} ({semDetectada.desde.toLocaleDateString('es-AR')} – {semDetectada.hasta.toLocaleDateString('es-AR')}). El selector manual queda solo para casos de emergencia.
          </p>
        ) : (
          <p style={styles.footnote}>Antes de guardar, la app siempre chequea que la fecha esté dentro del rango de fechas cargado en esa hoja (Pesada B2:D2).</p>
        )}
      </div>

      {registro.length > 0 && (
        <>
          <SectionLabel text="Registro de actividad" />
          <div style={styles.formCard}>
            {registro.slice(0, 15).map((r) => {
              const puedeDeshacer = r.estado === 'confirmado' && !r.deshecho && r.deshacerVenceEn && Date.now() < r.deshacerVenceEn && (r.tipo === 'venta' ? r.antes : r.row);
              return (
                <div key={r.id} style={{ borderBottom: '1px solid #E4D8C7', padding: '8px 0', fontFamily: 'Inter, sans-serif', fontSize: 11, color: '#5A4E42' }}>
                  <div>{new Date(r.hora).toLocaleString('es-AR')} · {r.usuario}</div>
                  <div>{r.tipo} · {r.hoja} · {r.semana} · {r.rango} · <b style={{ color: r.estado === 'confirmado' ? '#3B5C2A' : '#8A3423' }}>{r.deshecho ? 'deshecho' : r.estado}</b></div>
                  {puedeDeshacer && (
                    <button onClick={() => deshacerEntrada(r)} style={{ ...styles.segBtn, marginTop: 6, padding: '4px 10px', fontSize: 11 }}>Deshacer</button>
                  )}
                </div>
              );
            })}
          </div>
        </>
      )}

      {pendientes.length > 0 && (
        <>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <SectionLabel text={`Pendientes de sincronizar (${pendientes.length})`} />
            <button onClick={sincronizarPendientes} disabled={!isOnline || !cuentaConectada || !excelFile} style={{ ...styles.segBtn, padding: '4px 10px', fontSize: 11, marginBottom: 10, opacity: (!isOnline || !cuentaConectada || !excelFile) ? 0.5 : 1 }}>
              Sincronizar todo ahora
            </button>
          </div>
          <div style={styles.formCard}>
            {pendientes.map((p) => (
              <div key={p.id} style={{ background: '#F4D9D3', border: '1px solid #E2B3A6', borderRadius: 8, padding: 10, marginBottom: 8 }}>
                <div style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, fontWeight: 700, color: '#8A3423' }}>
                  {p.tipo === 'venta' ? `Venta — ${fmtDate(p.dateStr)} (${p.turno})`
                    : p.tipo === 'gasto' ? `Gasto — ${p.gasto.tipo === 'gasoil' ? 'Gasoil' : 'Otros variables'} (${fmt(p.gasto.monto)}, ${p.semSheet})`
                    : `Compra — ${fmtDate(p.compra.fecha)} (${p.compra.proveedor})`}
                </div>
                <div style={{ fontFamily: 'Inter, sans-serif', fontSize: 11, color: '#8A3423', marginTop: 2 }}>{p.error}</div>
                <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
                  <button onClick={() => reintentarPendiente(p)} style={{ ...styles.segBtn, flex: 1 }}>Reintentar sincronización</button>
                  <button onClick={() => quitarPendiente(p.id)} style={styles.deleteBtn}><Trash2 size={16} /></button>
                </div>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

const CAPACIDAD_COMPRAS_SEMANA = 40;

function ComprasTab({ cForm, setCForm, agregarCompra, compras, proveedorSummary, selectedWeek, totalComprasSemana, cSaving, cuentaConectada, excelFile, actualizarComprasDesdeExcel, comprasSync, semDetectada, isOnline, comprasSemanaCount, comprasHuerfanas }) {
  const set = (field) => (e) => setCForm((p) => ({ ...p, [field]: e.target.value }));
  const total = cForm.modo === 'importe' ? parseImporte(cForm.importe) : parseCantidad(cForm.kg) * parseImporte(cForm.precioKg);
  const puedeGuardar = !cSaving;
  const disponibles = CAPACIDAD_COMPRAS_SEMANA - comprasSemanaCount;
  return (
    <div style={styles.screen}>
      <SectionLabel text="Cargar compra" />
      {comprasHuerfanas && comprasHuerfanas.length > 0 && (
        <div style={{ background: '#F4D9D3', border: '1px solid #C0392B', borderRadius: 8, padding: '10px 12px', marginBottom: 10 }}>
          <div style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, fontWeight: 700, color: '#8A3423', marginBottom: 4 }}>
            ⚠️ {comprasHuerfanas.length} fila{comprasHuerfanas.length === 1 ? '' : 's'} con datos pero sin fecha
          </div>
          {comprasHuerfanas.map((h) => (
            <div key={h.row} style={{ fontFamily: 'Inter, sans-serif', fontSize: 11, color: '#8A3423' }}>
              Fila {h.row}: {h.proveedor || '(sin proveedor)'} {h.descripcion ? `— ${h.descripcion}` : ''} {h.observaciones ? `(obs: ${h.observaciones})` : ''}
            </div>
          ))}
          <div style={{ fontFamily: 'Inter, sans-serif', fontSize: 11, color: '#8A3423', marginTop: 4 }}>
            Esto suele pasar cuando una compra se guardó a medias por un corte de conexión. Revisá esa fila directamente en el Excel: si los datos son correctos, solo le falta la fecha (completala a mano); si están mezclados o repetidos, borralos y volvé a cargar la compra desde la app.
          </div>
        </div>
      )}
      <div style={{
        display: 'flex', justifyContent: 'space-between', alignItems: 'center',
        background: disponibles <= 4 ? '#F4D9D3' : '#FFFFFF', border: '1px solid #E4D8C7', borderRadius: 8,
        padding: '8px 12px', marginBottom: 10,
      }}>
        <span style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, fontWeight: 600, color: disponibles <= 4 ? '#8A3423' : '#5A4E42' }}>
          Compras cargadas: {comprasSemanaCount} de {CAPACIDAD_COMPRAS_SEMANA}
        </span>
        {disponibles <= 4 && (
          <span style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, fontWeight: 700, color: '#8A3423' }}>
            ⚠️ Quedan solamente {Math.max(disponibles, 0)} fila{disponibles === 1 ? '' : 's'} disponible{disponibles === 1 ? '' : 's'}
          </span>
        )}
      </div>
      {!isOnline && (
        <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, color: '#7A5B23', background: '#F0E6D2', padding: 10, borderRadius: 8 }}>
          Sin conexión a internet. Podés seguir cargando — se guarda en el teléfono y se sube solo cuando vuelva la señal.
        </p>
      )}
      {isOnline && (!cuentaConectada || !excelFile) && (
        <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, color: '#7A5B23', background: '#F0E6D2', padding: 10, borderRadius: 8 }}>
          Excel no conectado. Se guarda local por ahora — conectalo en Ajustes para sincronizar.
        </p>
      )}
      {semDetectada && (
        <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 11, color: '#3B5C2A', marginBottom: 8 }}>
          Semana detectada para esta fecha: {semDetectada.sem}
        </p>
      )}
      <div style={styles.formCard}>
        <label style={styles.label}>Fecha</label>
        <input type="date" value={cForm.fecha} onChange={set('fecha')} style={styles.input} />
        <label style={styles.label}>Proveedor</label>
        <select value={cForm.proveedor} onChange={set('proveedor')} style={styles.input}>
          {PROVEEDORES.map((p) => <option key={p} value={p}>{p}</option>)}
        </select>
        {cForm.proveedor === 'Otro' && (
          <input type="text" placeholder="Nombre del proveedor" value={cForm.proveedorOtro} onChange={set('proveedorOtro')} style={{ ...styles.input, fontFamily: 'Inter, sans-serif', marginTop: 6 }} />
        )}
        <label style={styles.label}>Tipo</label>
        <select value={cForm.tipo} onChange={set('tipo')} style={styles.input}>
          {TIPOS.map((t) => <option key={t} value={t}>{t}</option>)}
        </select>
        {cForm.tipo === 'Otro' && (
          <input type="text" placeholder="Tipo de compra" value={cForm.tipoOtro} onChange={set('tipoOtro')} style={{ ...styles.input, fontFamily: 'Inter, sans-serif', marginTop: 6 }} />
        )}
        <label style={styles.label}>Descripción / corte</label>
        <input type="text" placeholder="Ej: Novillo, cajón de pollo…" value={cForm.descripcion} onChange={set('descripcion')} style={{ ...styles.input, fontFamily: 'Inter, sans-serif' }} />

        <div style={styles.fieldGroupLabel}>Cómo cargar el importe</div>
        <div style={styles.segmented}>
          <button onClick={() => setCForm((p) => ({ ...p, modo: 'kg' }))} style={{ ...styles.segBtn, ...(cForm.modo === 'kg' ? styles.segBtnActive : {}) }}>Kg/unidad × precio</button>
          <button onClick={() => setCForm((p) => ({ ...p, modo: 'importe' }))} style={{ ...styles.segBtn, ...(cForm.modo === 'importe' ? styles.segBtnActive : {}) }}>Importe total</button>
        </div>
        {cForm.modo === 'kg' ? (
          <>
            <div style={styles.twoCol}>
              <Field label="Kg / Und" value={cForm.kg} onChange={set('kg')} />
              <Field label="Precio x kg" value={cForm.precioKg} onChange={set('precioKg')} />
            </div>
            <p style={styles.footnote}>Podés ingresar decimales con coma. Ejemplo: 126,50</p>
          </>
        ) : (
          <Field label="Importe total $" value={cForm.importe} onChange={set('importe')} />
        )}
        <label style={styles.label}>Observaciones (opcional)</label>
        <input type="text" placeholder="Notas de esta compra" value={cForm.observaciones} onChange={set('observaciones')} style={{ ...styles.input, fontFamily: 'Inter, sans-serif' }} />

        <div style={styles.totalLine}>
          <span style={{ fontFamily: 'Inter, sans-serif', fontSize: 13, fontWeight: 700, color: '#5A4E42' }}>TOTAL</span>
          <span style={{ fontFamily: 'Oswald, sans-serif', fontSize: 20, fontWeight: 700, color: '#7A2331' }}>{fmt(total)}</span>
        </div>
        <button onClick={agregarCompra} disabled={!puedeGuardar} style={{ ...styles.primaryBtn, ...(!puedeGuardar ? { opacity: 0.5, cursor: 'not-allowed' } : {}) }}>
          <Plus size={16} style={{ marginRight: 4, verticalAlign: -3 }} />{cSaving ? 'Guardando…' : 'Agregar compra'}
        </button>
      </div>
      {proveedorSummary.length > 0 && (
        <>
          <SectionLabel text={`Por proveedor (semana ${fmtDate(selectedWeek)})`} />
          {proveedorSummary.map((p) => (
            <div key={p.proveedor} style={styles.listRow}>
              <span style={{ fontFamily: 'Inter, sans-serif', fontSize: 13, fontWeight: 600, color: '#2A211C' }}>{p.proveedor}</span>
              <span style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, color: '#8A7C6B' }}>{p.compras} compra{p.compras > 1 ? 's' : ''} · {p.visitas} visita{p.visitas > 1 ? 's' : ''}</span>
              <span style={{ fontFamily: 'IBM Plex Mono, monospace', fontSize: 13, fontWeight: 700, color: '#7A2331' }}>{fmt(p.total)}</span>
            </div>
          ))}
          <div style={styles.totalLine}>
            <span style={{ fontFamily: 'Inter, sans-serif', fontSize: 13, fontWeight: 700, color: '#5A4E42' }}>TOTAL SEMANA</span>
            <span style={{ fontFamily: 'IBM Plex Mono, monospace', fontSize: 16, fontWeight: 700, color: '#2A211C' }}>{fmt(totalComprasSemana)}</span>
          </div>
        </>
      )}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <SectionLabel text="Historial" />
        <button onClick={actualizarComprasDesdeExcel} disabled={comprasSync === 'loading' || !cuentaConectada || !excelFile} style={{ ...styles.segBtn, padding: '4px 10px', fontSize: 11, marginBottom: 10 }}>
          {comprasSync === 'loading' ? 'Actualizando…' : 'Actualizar compras desde Excel'}
        </button>
      </div>
      <p style={styles.footnote}>Por ahora no se puede borrar una compra desde la app (para no dejar huecos en el Excel). Si cargaste algo mal, corregilo directamente en el archivo.</p>
      {compras.length === 0 && <p style={styles.emptyText}>Todavía no cargaste ninguna compra.</p>}
      {compras.slice(0, 20).map((c) => (
        <div key={c.id} style={styles.listRowCompras}>
          <div>
            <div style={{ fontFamily: 'Inter, sans-serif', fontSize: 13, fontWeight: 600, color: '#2A211C' }}>{c.proveedor} · {fmtDate(c.fecha)}</div>
            <div style={{ fontFamily: 'Inter, sans-serif', fontSize: 11, color: '#8A7C6B' }}>{c.descripcion || c.tipo} {c.kg ? `· ${c.kg}kg` : ''}</div>
          </div>
          <span style={{ fontFamily: 'IBM Plex Mono, monospace', fontSize: 13, fontWeight: 700, color: '#7A2331' }}>{fmt(c.total)}</span>
        </div>
      ))}
    </div>
  );
}

function StockTab({ selectedWeek, setSelectedWeek, cuentaConectada, excelFile, resumenExcel, resumenExcelEstado, resumenExcelHora, cargarResumenExcel }) {
  return (
    <div style={styles.screen}>
      <WeekPicker selectedWeek={selectedWeek} setSelectedWeek={setSelectedWeek} />

      {(!cuentaConectada || !excelFile) ? (
        <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, color: '#8A3423', background: '#F4D9D3', padding: 10, borderRadius: 8 }}>
          Excel no conectado. El stock oficial solo puede consultarse conectando la planilla.
        </p>
      ) : (
        <>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
            <span style={{ fontFamily: 'Inter, sans-serif', fontSize: 11, color: '#8A7C6B' }}>
              {resumenExcelEstado === 'loading' ? 'Actualizando stock desde Excel…' : resumenExcelHora ? `Última actualización: ${resumenExcelHora.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' })}` : ''}
            </span>
            <button onClick={cargarResumenExcel} disabled={resumenExcelEstado === 'loading'} style={{ ...styles.segBtn, padding: '4px 10px', fontSize: 11 }}>Actualizar desde Excel</button>
          </div>

          {resumenExcelEstado === 'error' && (
            <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, color: '#8A3423', background: '#F4D9D3', padding: 10, borderRadius: 8 }}>
              No se pudo leer el stock oficial del Excel. No se modificó ningún dato.
            </p>
          )}

          {resumenExcel && (
            <div style={styles.formCard}>
              <DetailRow label="Existencia inicial — Excel" value={fmt(resumenExcel.existenciaInicial)} />
              <DetailRow label="Compras de la semana — Excel" value={fmt(resumenExcel.totalCompras)} />
              <DetailRow
                label="Existencia final — Excel"
                value={resumenExcel.existenciaFinalPendiente ? 'Existencia final pendiente de pesada.' : fmt(resumenExcel.existenciaFinal)}
                muted={resumenExcel.existenciaFinalPendiente}
              />
              <div style={styles.totalLine}>
                <span style={{ fontFamily: 'Inter, sans-serif', fontSize: 13, fontWeight: 700, color: '#5A4E42' }}>COGS — Excel</span>
                <span style={{ fontFamily: 'Oswald, sans-serif', fontSize: 20, fontWeight: 700, color: '#7A2331' }}>{fmt(resumenExcel.cogs)}</span>
              </div>
              <div style={{ ...styles.totalLine, borderTop: 'none', paddingTop: 0 }}>
                <span style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, color: '#8A7C6B' }}>Gastos operativos — Excel</span>
                <span style={{ fontFamily: 'IBM Plex Mono, monospace', fontSize: 14, fontWeight: 700, color: '#8A7C6B' }}>{fmt(resumenExcel.gastosOperativos)}</span>
              </div>
            </div>
          )}
          <p style={styles.footnote}>Estos valores salen directo del Excel (existencias, COGS y gastos), incluyendo el arrastre entre semanas que ya hacen las fórmulas del archivo. La app no calcula ni escribe nada acá — solo lo muestra.</p>
        </>
      )}
    </div>
  );
}

function GastosTab({ gForm, setGForm, agregarGasto, gSaving, selectedWeek, setSelectedWeek, semExcelActual, resumenExcel, resumenExcelEstado, cargarResumenExcel, gastosLocal, cuentaConectada, excelFile, isOnline }) {
  const historialSemana = gastosLocal[selectedWeek] || [];
  const conectado = cuentaConectada && excelFile;
  return (
    <div style={styles.screen}>
      <WeekPicker selectedWeek={selectedWeek} setSelectedWeek={setSelectedWeek} />

      <SectionLabel text={`Cargar gasto — ${semExcelActual}`} />
      <div style={styles.formCard}>
        <label style={styles.label}>Tipo de gasto</label>
        <div style={{ display: 'flex', gap: 8 }}>
          <button onClick={() => setGForm((f) => ({ ...f, tipo: 'gasoil' }))} style={{ ...styles.segBtn, ...(gForm.tipo === 'gasoil' ? styles.segBtnActive : {}) }}>
            <Fuel size={14} /> Gasoil
          </button>
          <button onClick={() => setGForm((f) => ({ ...f, tipo: 'otros' }))} style={{ ...styles.segBtn, ...(gForm.tipo === 'otros' ? styles.segBtnActive : {}) }}>
            Otros variables
          </button>
        </div>
        <label style={styles.label}>Monto</label>
        <input type="number" inputMode="decimal" value={gForm.monto} onChange={(e) => setGForm((f) => ({ ...f, monto: e.target.value }))} placeholder="$" style={styles.input} />
        <button onClick={agregarGasto} disabled={gSaving || !gForm.monto} style={{ ...styles.primaryBtn, ...((gSaving || !gForm.monto) ? { opacity: 0.5, cursor: 'not-allowed' } : {}) }}>
          <Plus size={16} style={{ marginRight: 4, verticalAlign: -3 }} />{gSaving ? 'Guardando…' : `Sumar a ${gForm.tipo === 'gasoil' ? 'Gasoil' : 'Otros variables'}`}
        </button>
        <p style={styles.footnote}>
          Se SUMA al total que ya tenga cargado esa semana en {semExcelActual} — Resumen ({gForm.tipo === 'gasoil' ? 'celda C79, Gasoil' : 'celda C76, Otros gastos variables'}), no lo reemplaza. Cargá cada gasto por separado (cada carga de combustible, cada gasto variable) y la app va acumulando.
          {!isOnline && ' Sin conexión: se guarda acá y se sube solo cuando vuelva internet.'}
        </p>
      </div>

      <SectionLabel text="Totales de la semana — Excel" />
      {!conectado ? (
        <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, color: '#8A3423', background: '#F4D9D3', padding: 10, borderRadius: 8 }}>
          Excel no conectado — los totales oficiales no se pueden mostrar hasta conectar la planilla.
        </p>
      ) : (
        <>
          <div style={styles.cardRow}>
            <MiniCard label="Gasoil" value={fmt(resumenExcel && resumenExcel.gasoil)} />
            <MiniCard label="Otros variables" value={fmt(resumenExcel && resumenExcel.otrosGastosVariables)} />
          </div>
          <button onClick={cargarResumenExcel} disabled={resumenExcelEstado === 'loading'} style={{ ...styles.segBtn, padding: '4px 10px', fontSize: 11, marginBottom: 4 }}>
            {resumenExcelEstado === 'loading' ? 'Actualizando…' : 'Actualizar desde Excel'}
          </button>
        </>
      )}

      <SectionLabel text="Cargado desde la app esta semana (local)" />
      {historialSemana.length === 0 ? (
        <p style={styles.emptyText}>Todavía no cargaste gastos esta semana desde la app.</p>
      ) : historialSemana.map((g) => (
        <div key={g.id} style={styles.listRow}>
          <span style={{ fontFamily: 'Inter, sans-serif', fontSize: 13, color: '#2A211C' }}>
            {g.tipo === 'gasoil' ? 'Gasoil' : 'Otros variables'} · {fmtDate(g.fecha)}{g.pendienteLocal ? ' · pendiente' : ''}
          </span>
          <span style={{ fontFamily: 'IBM Plex Mono, monospace', fontSize: 14, fontWeight: 700, color: g.pendienteLocal ? '#B58A00' : '#5A4E42' }}>{fmt(g.monto)}</span>
        </div>
      ))}
    </div>
  );
}
